<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全錸蒔國際餐飲 營運管理系統</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="全錸蒔餐飲">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="app"></div>

  <script>
    // 安全初始化資料與狀態
    const todayStr = new Date().toISOString().slice(0, 10);
    
    let windowState = {
      currentUser: JSON.parse(localStorage.getItem('shangyu_loginUser')) || { name: '王聖銓', role: '總店長' },
      activeModule: 'announcements',
      isAdmin: false,
      slogan: '饌玉炊金，全錸蒔誠獻 — 傳承真摯好味道',
      scheduleYear: new Date().getFullYear(),
      scheduleMonth: new Date().getMonth() + 1,
      selectedTaskDate: todayStr,
      employees: [
        { id: 'E001', name: '王聖銓', role: '總店長', type: '正職員工', status: '在職', healthCheckDate: '2025-06-15', phone: '0912-345-678', leaveEntitled: 10, leaveUsed: 4.5 },
        { id: 'E002', name: '陳副店', role: '門市副店長', type: '正職員工', status: '在職', healthCheckDate: '2025-08-01', phone: '0923-456-789', leaveEntitled: 7, leaveUsed: 2 },
        { id: 'E003', name: '林小婷', role: '外場服務員', type: '兼職 (PT)', status: '在職', healthCheckDate: '2024-05-10', phone: '0934-567-890', leaveEntitled: 3, leaveUsed: 1 }
      ],
      cars: JSON.parse(localStorage.getItem('car_list')) || [
        { id: 'car1', plate: 'ABC-1234', model: 'Toyota Corolla Altis', currentMileage: 15200, lastServiceMileage: 12000, serviceInterval: 5000, photoUrl: '', status: 'available', currentDriver: '' },
        { id: 'car2', plate: 'XYZ-5678', model: 'Honda CR-V', currentMileage: 8420, lastServiceMileage: 5000, serviceInterval: 5000, photoUrl: '', status: 'available', currentDriver: '' }
      ],
      carRecords: JSON.parse(localStorage.getItem('car_records')) || [],
      schedules: {},
      clockRecords: [],
      activeModal: null,
      modalData: {}
    };

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const t = document.createElement('div');
      t.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-xl mb-2`;
      t.textContent = msg;
      container.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    window.switchModule = (mod) => { windowState.activeModule = mod; render(); };
    window.closeModal = () => { windowState.activeModal = null; render(); };
    window.userLogout = () => { windowState.currentUser = null; localStorage.removeItem('shangyu_loginUser'); render(); };
    window.toggleAdminLock = () => { windowState.isAdmin = !windowState.isAdmin; showToast(windowState.isAdmin ? '管理員已解鎖' : '管理員已上鎖'); render(); };
    window.openAdminModal = () => { windowState.activeModal = 'admin'; render(); };

    window.handleAdminLoginSubmit = (e) => {
      e.preventDefault();
      if (document.getElementById('admin-pin').value === '8888') {
        windowState.isAdmin = true; windowState.activeModal = null; showToast('管理員解鎖成功');
      } else { showToast('密碼錯誤', 'error'); }
      render();
    };

    // 公務車互動函數
    window.openAddCarModal = () => {
      windowState.modalData = { isEdit: false, id: 'car_' + Date.now(), plate: '', model: '', currentMileage: 0, serviceInterval: 5000, photoUrl: '' };
      windowState.activeModal = 'carEditModal'; render();
    };
    window.openEditCarModal = (id) => {
      const car = windowState.cars.find(c => c.id === id);
      if (car) { windowState.modalData = { isEdit: true, ...car }; windowState.activeModal = 'carEditModal'; render(); }
    };
    window.handleCarPhotoUploadInModal = (e) => {
      const f = e.target.files[0];
      if (f) { const r = new FileReader(); r.onload = (ev) => { windowState.modalData.photoUrl = ev.target.result; }; r.readAsDataURL(f); }
    };
    window.handleSaveCarSubmit = (e) => {
      e.preventDefault();
      const m = windowState.modalData;
      const plate = document.getElementById('car-modal-plate').value.trim();
      const model = document.getElementById('car-modal-model').value.trim();
      const currentMileage = Number(document.getElementById('car-modal-mileage').value);
      const serviceInterval = Number(document.getElementById('car-modal-interval').value) || 5000;
      if (m.isEdit) {
        windowState.cars = windowState.cars.map(c => c.id === m.id ? { ...c, plate, model, currentMileage, serviceInterval, photoUrl: m.photoUrl || c.photoUrl } : c);
      } else {
        windowState.cars.push({ id: m.id, plate, model, currentMileage, lastServiceMileage: currentMileage, serviceInterval, photoUrl: m.photoUrl || '', status: 'available', currentDriver: '' });
      }
      localStorage.setItem('car_list', JSON.stringify(windowState.cars));
      windowState.activeModal = null; showToast('車輛資料已儲存'); render();
    };
    window.deleteCar = (id) => {
      if (windowState.cars.length <= 1) return alert('至少需保留一台車');
      if (confirm('確定刪除此車？')) { windowState.cars = windowState.cars.filter(c => c.id !== id); localStorage.setItem('car_list', JSON.stringify(windowState.cars)); render(); }
    };
    window.openCarBorrowModal = (carId) => {
      windowState.modalData = { carId, startMileage: windowState.cars.find(c => c.id === carId)?.currentMileage || 0 };
      windowState.activeModal = 'carBorrowModal'; render();
    };
    window.handleBorrowCarSubmit = (e) => {
      e.preventDefault();
      const m = windowState.modalData;
      const dest = document.getElementById('borrow-destination').value.trim();
      const mileage = Number(document.getElementById('borrow-mileage').value);
      windowState.cars = windowState.cars.map(c => c.id === m.carId ? { ...c, status: 'in-use', currentMileage: mileage, currentDriver: windowState.currentUser.name } : c);
      windowState.carRecords.unshift({ id: 'rec_' + Date.now(), carId: m.carId, plate: windowState.cars.find(c => c.id === m.carId)?.plate, driver: windowState.currentUser.name, startDate: todayStr, startMileage: mileage, returnMileage: null, notes: dest });
      localStorage.setItem('car_list', JSON.stringify(windowState.cars)); localStorage.setItem('car_records', JSON.stringify(windowState.carRecords));
      windowState.activeModal = null; showToast('出發登記成功'); render();
    };
    window.returnCarAction = (carId) => {
      const rec = windowState.carRecords.find(r => r.carId === carId && r.returnMileage === null);
      if (rec) { windowState.modalData = { recordId: rec.id, carId, startMileage: rec.startMileage, plate: rec.plate }; windowState.activeModal = 'carReturnModal'; render(); }
    };
    window.handleReturnCarSubmit = (e) => {
      e.preventDefault();
      const m = windowState.modalData;
      const retMil = Number(document.getElementById('modal-return-mileage').value);
      const rec = windowState.carRecords.find(r => r.id === m.recordId);
      if (rec) { rec.returnDate = todayStr; rec.returnMileage = retMil; rec.notes = document.getElementById('modal-notes').value || '車況正常'; }
      windowState.cars = windowState.cars.map(c => c.id === m.carId ? { ...c, currentMileage: retMil, status: 'available', currentDriver: '' } : c);
      localStorage.setItem('car_list', JSON.stringify(windowState.cars)); localStorage.setItem('car_records', JSON.stringify(windowState.carRecords));
      windowState.activeModal = null; showToast('還車完成'); render();
    };
    window.resetService = (carId) => {
      windowState.cars = windowState.cars.map(c => c.id === carId ? { ...c, lastServiceMileage: c.currentMileage } : c);
      localStorage.setItem('car_list', JSON.stringify(windowState.cars)); showToast('保養歸零成功'); render();
    };

    function renderCarManagement() {
      const cars = windowState.cars || [];
      const records = windowState.carRecords || [];
      return `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl border flex justify-between items-center shadow-sm">
            <div>
              <h2 class="text-lg font-black text-slate-900">🚗 公務車企業管理與使用登記</h2>
              <p class="text-xs text-slate-500">支援新增車輛、上傳照片、自訂保養里程提醒與分段還車</p>
            </div>
            <button onclick="openAddCarModal()" class="bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl">＋ 新增公務車</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${cars.map(car => {
              const interval = car.serviceInterval || 5000;
              const kmSinceService = car.currentMileage - (car.lastServiceMileage || 0);
              const needsService = kmSinceService >= interval;
              const isInUse = car.status === 'in-use';
              return `
                <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-3 ${isInUse ? 'border-amber-400 bg-amber-50/20' : ''}">
                  <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                      ${car.photoUrl ? `<img src="${car.photoUrl}" class="w-12 h-12 rounded-2xl object-cover border" />` : `<div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold"><i class="fa-solid fa-car"></i></div>`}
                      <div>
                        <h3 class="font-black text-slate-900">${car.plate}</h3>
                        <p class="text-xs text-slate-500">${car.model} (保養門檻:${interval}km)</p>
                      </div>
                    </div>
                    <div class="text-right">
                      <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${isInUse ? 'bg-amber-500 text-slate-950' : 'bg-emerald-600 text-white'}">${isInUse ? '使用中' : '停放中'}</span>
                      ${windowState.isAdmin ? `<div class="mt-1"><button onclick="openEditCarModal('${car.id}')" class="text-[10px] bg-slate-100 px-2 py-0.5 rounded mr-1">編輯</button><button onclick="deleteCar('${car.id}')" class="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded">刪除</button></div>` : ''}
                    </div>
                  </div>
                  <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-2xl border">
                    <div>當前里程：<strong class="font-mono">${car.currentMileage.toLocaleString()} km</strong></div>
                    <div>距上次保養：<strong class="font-mono ${needsService ? 'text-rose-600 font-bold' : 'text-indigo-700'}">${kmSinceService.toLocaleString()} km</strong></div>
                  </div>
                  <div class="flex justify-between items-center pt-1">
                    <button onclick="resetService('${car.id}')" class="text-xs text-slate-500 hover:text-indigo-600 font-bold">🛠️ 登記已保養</button>
                    ${isInUse ? `<button onclick="returnCarAction('${car.id}')" class="px-3 py-1.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">✅ 填寫還車</button>` : `<button onclick="openCarBorrowModal('${car.id}')" class="px-3 py-1.5 bg-slate-900 text-white font-bold rounded-xl text-xs">🔑 登記出發</button>`}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderModals() {
      if (!windowState.activeModal) return '';
      if (windowState.activeModal === 'admin') {
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleAdminLoginSubmit(event)" class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-3">
              <h3 class="font-bold text-base">🔑 解鎖管理員</h3>
              <input type="password" maxlength="4" id="admin-pin" required placeholder="••••" class="w-full p-2.5 border rounded-xl text-center font-mono text-lg" />
              <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 text-xs">取消</button><button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">解鎖</button></div>
            </form>
          </div>
        `;
      }
      if (windowState.activeModal === 'carEditModal') {
        const m = windowState.modalData;
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleSaveCarSubmit(event)" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
              <h3 class="font-bold text-base">${m.isEdit ? '✏️ 編輯公務車' : '➕ 新增公務車'}</h3>
              <div class="space-y-2 text-xs">
                <div class="grid grid-cols-2 gap-2">
                  <div><label class="font-bold">車牌</label><input type="text" id="car-modal-plate" required value="${m.plate || ''}" class="w-full p-2.5 border rounded-xl font-bold" /></div>
                  <div><label class="font-bold">型號</label><input type="text" id="car-modal-model" required value="${m.model || ''}" class="w-full p-2.5 border rounded-xl font-bold" /></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div><label class="font-bold">當前里程</label><input type="number" id="car-modal-mileage" required value="${m.currentMileage || 0}" class="w-full p-2.5 border rounded-xl font-mono" /></div>
                  <div><label class="font-bold">保養間隔</label><input type="number" id="car-modal-interval" required value="${m.serviceInterval || 5000}" class="w-full p-2.5 border rounded-xl font-mono" /></div>
                </div>
                <div><label class="font-bold">照片</label><input type="file" accept="image/*" onchange="handleCarPhotoUploadInModal(event)" class="w-full p-1 border rounded-xl text-xs" /></div>
              </div>
              <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 text-xs">取消</button><button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">儲存</button></div>
            </form>
          </div>
        `;
      }
      if (windowState.activeModal === 'carBorrowModal') {
        const m = windowState.modalData;
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleBorrowCarSubmit(event)" class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-3">
              <h3 class="font-bold text-base">🔑 登記借用</h3>
              <div class="space-y-2 text-xs">
                <div><label class="font-bold">目的地/事由</label><input type="text" id="borrow-destination" required class="w-full p-2.5 border rounded-xl" /></div>
                <div><label class="font-bold">出發里程</label><input type="number" id="borrow-mileage" required value="${m.startMileage}" class="w-full p-2.5 border rounded-xl font-mono" /></div>
              </div>
              <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 text-xs">取消</button><button type="submit" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">確認</button></div>
            </form>
          </div>
        `;
      }
      if (windowState.activeModal === 'carReturnModal') {
        const m = windowState.modalData;
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleReturnCarSubmit(event)" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
              <h3 class="font-bold text-base">✅ 還車登記</h3>
              <div class="space-y-2 text-xs">
                <div><label class="font-bold">歸還里程</label><input type="number" id="modal-return-mileage" required value="${m.startMileage + 15}" class="w-full p-2.5 border rounded-xl font-mono" /></div>
                <div><label class="font-bold">備註</label><textarea id="modal-notes" rows="2" class="w-full p-2.5 border rounded-xl"></textarea></div>
              </div>
              <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 text-xs">取消</button><button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">完成</button></div>
            </form>
          </div>
        `;
      }
      return '';
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!windowState.currentUser) {
        app.innerHTML = `
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 text-center">
              <h2 class="font-black text-lg">全錸蒔營運系統</h2>
              <button onclick="windowState.currentUser = {name:'王聖銓', role:'總店長'}; localStorage.setItem('shangyu_loginUser', JSON.stringify(windowState.currentUser)); render();" class="w-full bg-amber-400 font-bold py-3 rounded-xl">一鍵快速登入</button>
            </div>
          </div>
        `;
        return;
      }

      app.innerHTML = `
        <div class="min-h-screen bg-slate-100 flex justify-center py-0 sm:py-6">
          <div class="w-full max-w-5xl bg-white min-h-screen sm:rounded-3xl shadow-2xl border flex flex-col">
            <header class="bg-slate-900 text-white p-4 flex justify-between items-center">
              <h1 class="font-bold">全錸蒔管理系統</h1>
              <div class="flex gap-2">
                <button onclick="userLogout()" class="bg-rose-600 px-3 py-1 rounded text-xs font-bold">登出</button>
                <button onclick="openAdminModal()" class="bg-amber-400 text-slate-950 px-3 py-1 rounded text-xs font-bold">管理員</button>
              </div>
            </header>
            <nav class="bg-slate-800 text-white p-2 flex gap-1 overflow-x-auto text-xs">
              <button onclick="switchModule('announcements')" class="px-3 py-1.5 rounded font-bold ${windowState.activeModule==='announcements'?'bg-amber-400 text-slate-950':''}">1.布告欄</button>
              <button onclick="switchModule('carManagement')" class="px-3 py-1.5 rounded font-bold ${windowState.activeModule==='carManagement'?'bg-amber-400 text-slate-950':''}">6.公務車登記</button>
            </nav>
            <main class="flex-1 p-5 bg-slate-50">
              ${windowState.activeModule === 'carManagement' ? renderCarManagement() : `<div class="p-6 bg-white rounded-2xl border text-center"><h2 class="font-bold text-base">歡迎使用全錸蒔營運系統</h2><p class="text-xs text-slate-500 mt-2">請切換至「6.公務車登記」測試車輛管理功能。</p></div>`}
            </main>
          </div>
        </div>
        ${renderModals()}
      `;
    }

    render();
  </script>
</body>
</html>
