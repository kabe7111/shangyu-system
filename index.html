    function getHealthCheckInfo(checkDateStr) {
      if (!checkDateStr) return { status: '🔴 尚未建檔', isExpired: true, daysLeft: -999 };
      const checkDate = new Date(checkDateStr);
      const expireDate = new Date(checkDate);
      expireDate.setFullYear(expireDate.getFullYear() + 1);
      const today = new Date();
      today.setHours(0,0,0,0);
      const diffTime = expireDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays < 0) {
        return { status: `🔴 體檢已過期 (${Math.abs(diffDays)}天前)`, isExpired: true, daysLeft: diffDays };
      } else if (diffDays <= 30) {
        return { status: `🟡 體檢即將到期 (剩${diffDays}天)`, isExpired: false, daysLeft: diffDays, isWarning: true };
      } else {
        return { status: `🟢 合格 (效期至 ${expireDate.toISOString().slice(0,10)})`, isExpired: false, daysLeft: diffDays };
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-500 text-slate-950';
      toast.className = `${bgClass} text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-2 pointer-events-none flex items-center justify-between min-w-[240px]`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-3 font-black text-sm opacity-80 hover:opacity-100">✕</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function initFirebaseSync() {
      if (!db) return;
      try {
        const docRef = doc(db, 'system', 'mainData');

          if (docSnap.exists()) applyCloudData(docSnap.data());
          else saveStateToCloud();
        }).catch(() => {});
        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) applyCloudData(docSnap.data());
        }, () => {});
      } catch (e) {}
    }

    function applyCloudData(data) {
      let hasChanges = false;
      if (data.employees && JSON.stringify(data.employees) !== JSON.stringify(windowState.employees)) { windowState.employees = data.employees; hasChanges = true; }
      if (data.announcements && JSON.stringify(data.announcements) !== JSON.stringify(windowState.announcements)) { windowState.announcements = data.announcements; hasChanges = true; }
      if (data.tasks && JSON.stringify(data.tasks) !== JSON.stringify(windowState.tasks)) { windowState.tasks = data.tasks; hasChanges = true; }
      if (data.schedules && JSON.stringify(data.schedules) !== JSON.stringify(windowState.schedules)) { windowState.schedules = data.schedules; hasChanges = true; }
      if (data.clockRecords && JSON.stringify(data.clockRecords) !== JSON.stringify(windowState.clockRecords)) { windowState.clockRecords = data.clockRecords; hasChanges = true; }
      if (data.cars && JSON.stringify(data.cars) !== JSON.stringify(windowState.cars)) { windowState.cars = data.cars; hasChanges = true; }
      if (data.carRecords && JSON.stringify(data.carRecords) !== JSON.stringify(windowState.carRecords)) { windowState.carRecords = data.carRecords; hasChanges = true; }
      if (data.evaluations && JSON.stringify(data.evaluations) !== JSON.stringify(windowState.evaluations)) { windowState.evaluations = data.evaluations; hasChanges = true; }
      if (data.evalArchives && JSON.stringify(data.evalArchives) !== JSON.stringify(windowState.evalArchives)) { windowState.evalArchives = data.evalArchives; hasChanges = true; }
      if (data.logoUrl && data.logoUrl !== windowState.logoUrl) { windowState.logoUrl = data.logoUrl; hasChanges = true; }
      if (data.slogan && data.slogan !== windowState.slogan) { windowState.slogan = data.slogan; hasChanges = true; }
      if (hasChanges) render();

      if (rec) { rec.returnDate = todayStr; rec.returnTime = new Date().toTimeString().slice(0,5); rec.returnMileage = retMil; rec.isRefuel = isRef; rec.refuelLiters = isRef ? Number(document.getElementById('modal-refuel-liters').value)||0 : 0; rec.refuelCost = isRef ? Number(document.getElementById('modal-refuel-cost').value)||0 : 0; rec.notes = document.getElementById('modal-notes').value || '車況正常'; }
      windowState.cars = windowState.cars.map(c => c.id === m.carId ? { ...c, currentMileage: retMil, status: 'available', currentDriver: '' } : c);
      localStorage.setItem('car_list', JSON.stringify(windowState.cars)); localStorage.setItem('car_records', JSON.stringify(windowState.carRecords));
      saveStateToCloud(); windowState.activeModal = null; showToast('✅ 還車完成！'); render();
    };
    window.toggleModalRefuelFields = () => { const el = document.getElementById('modal-refuel-details'); if(el) el.classList.toggle('hidden'); };
    window.resetService = (carId) => { windowState.cars = windowState.cars.map(c => c.id === carId ? { ...c, lastServiceMileage: c.currentMileage } : c); localStorage.setItem('car_list', JSON.stringify(windowState.cars)); saveStateToCloud(); showToast('🛠️ 保養歸零成功！'); render(); };
    window.deleteCarRecord = (id) => { if(confirm('確定刪除紀錄？')) { windowState.carRecords = windowState.carRecords.filter(r => r.id !== id); localStorage.setItem('car_records', JSON.stringify(windowState.carRecords)); saveStateToCloud(); render(); } };

    // 核心模組與輔助函數
    function shiftTypesConfig() {
      return [
        { type: '上班', label: '上班', color: 'bg-sky-100 text-sky-900 border-sky-300 font-bold' },
        { type: '休假', label: '休假', color: 'bg-rose-100 text-rose-900 border-rose-300 font-bold' },
        { type: '加班', label: '加班', color: 'bg-amber-200 text-amber-950 border-amber-400 font-extrabold' },
        { type: '特半', label: '特半', color: 'bg-emerald-100 text-emerald-900 border-emerald-300 font-bold' },
        { type: '特一', label: '特一', color: 'bg-emerald-200 text-emerald-950 border-emerald-400 font-extrabold' },
        { type: '事假', label: '事假', color: 'bg-amber-100 text-amber-900 border-amber-300 font-bold' },
        { type: '病假', label: '病假', color: 'bg-orange-100 text-orange-900 border-orange-300 font-bold' },
        { type: '陪產', label: '陪產', color: 'bg-purple-100 text-purple-900 border-purple-300 font-bold' },
        { type: '婚假', label: '婚假', color: 'bg-pink-100 text-pink-900 border-pink-300 font-bold' },
        { type: '喪假', label: '喪假', color: 'bg-slate-200 text-slate-900 border-slate-400 font-bold' }
      ];
    }

    function getNationalHolidayName(year, month, day) {
      const key = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const holidays = { [`${year}-01-01`]: '元旦', [`${year}-02-28`]: '和平紀念日', [`${year}-04-04`]: '兒童節', [`${year}-04-05`]: '清明節', [`${year}-05-01`]: '勞動節', [`${year}-10-10`]: '國慶日' };
      return holidays[key] || null;
    }

    function getMonthDaysData(year, month) {
      const daysInMonth = new Date(year, month, 0).getDate();
      const firstDayOffset = new Date(year, month - 1, 1).getDay();
      const days = [];
      for (let i = 1; i <= daysInMonth; i++) {
        const dObj = new Date(year, month - 1, i);
        const dayOfWeek = dObj.getDay();
        const weekDay = ['（日）', '（一）', '（二）', '（三）', '（四）', '（五）', '（六）'][dayOfWeek];
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
        const holidayName = getNationalHolidayName(year, month, i);
        days.push({ day: i, dateStr: `${year}-${String(month).padStart(2,'0')}-${String(i).padStart(2,'0')}`, weekDay, isWeekend, holidayName, isHoliday: !!holidayName });
      }
      return { days, firstDayOffset, totalRedDays: days.filter(d => d.isWeekend || d.isHoliday).length };
    }

    function getStaffShiftOnDate(empName, dateStr) {
      const dObj = new Date(dateStr);
      const y = dObj.getFullYear(), m = dObj.getMonth() + 1;
      const key = `${y}-${m}-${empName}`;
      const userShifts = windowState.schedules[key];
      const isH = getNationalHolidayName(y, m, dObj.getDate()) || dObj.getDay() === 0 || dObj.getDay() === 6;
      return userShifts ? (userShifts[dObj.getDate() - 1] || (isH ? '休假' : '上班')) : (isH ? '休假' : '上班');
    }

    function calculateScheduleAndConflicts() {
      const { days, firstDayOffset, totalRedDays } = getMonthDaysData(windowState.scheduleYear, windowState.scheduleMonth);
      const activeEmps = windowState.employees.filter(e => e.status !== '離職');
      const fullSchedules = activeEmps.map(emp => {
        const key = `${windowState.scheduleYear}-${windowState.scheduleMonth}-${emp.name}`;
        const shifts = windowState.schedules[key] || days.map(m => (m.isWeekend || m.isHoliday ? '休假' : '上班'));
        let scheduledOffCount = 0;
        shifts.forEach(s => { if (['休假', '事假', '病假', '陪產', '婚假', '喪假', '特一'].includes(s)) scheduledOffCount += 1; else if (s === '特半') scheduledOffCount += 0.5; });
        const hcInfo = getHealthCheckInfo(emp.healthCheckDate);
        return { empName: emp.name, role: emp.role, isHealthExpired: hcInfo.isExpired, shifts, requiredOffDays: totalRedDays, scheduledOffCount, remainingUnscheduledOff: totalRedDays - scheduledOffCount };
      });
      const dailyWorkingCounts = {};
      days.forEach((m, dIdx) => {
        let count = 0;
        fullSchedules.forEach(es => { if (['上班', '特半', '加班'].includes(es.shifts[dIdx] || '上班')) count++; });
        dailyWorkingCounts[m.day] = count;
      });
      return { days, firstDayOffset, fullSchedules, dailyWorkingCounts, totalRedDays };
    }

    function maskText(text, type) {
      if (windowState.isAdmin) return text;
      if (!text) return '***';
      if (type === 'phone') return text.slice(0, 3) + '****' + text.slice(-2);
      if (type === 'address') return text.slice(0, 6) + '***';
      return text;
    }

    function renderTasks() {
      const { days, firstDayOffset } = getMonthDaysData(windowState.scheduleYear, windowState.scheduleMonth);
      const todayTaskList = [...windowState.tasks.filter(t => t.date === todayStr)].sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      const selectedTaskList = [...windowState.tasks.filter(t => t.date === windowState.selectedTaskDate)].sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 text-white p-5 rounded-2xl shadow-md space-y-3">
            <div class="flex justify-between items-center border-b border-indigo-400/30 pb-3">
              <h2 class="font-black text-white text-lg">☀️【${todayStr}】今日工作排程與備料檢查</h2>
              <button onclick="openCreateTaskModal('${todayStr}')" class="bg-amber-400 text-slate-950 px-3.5 py-1.5 rounded-xl font-black text-xs cursor-pointer">+ 新增今日工作</button>
            </div>
            <div class="space-y-2">
              ${todayTaskList.map(t => `
                <div class="p-3.5 rounded-xl text-xs space-y-2 bg-white/10 border border-white/20 text-white">

                    <span class="px-2 py-0.5 bg-amber-400 text-slate-950 font-black rounded-lg text-[10px]">${t.category}</span>
                    <button onclick="initiateCompleteTask(${t.id})" class="px-2.5 py-1 rounded font-bold ${t.status === '已完成' ? 'bg-emerald-500 text-slate-950' : 'bg-amber-400 text-slate-950'}">${t.status === '已完成' ? '✅ 已完成' : '⏳ 點擊完成'}</button>
                  </div>
                  <h4 class="font-black text-amber-300 text-sm">${t.title}</h4>
                  <p class="text-slate-200 bg-black/30 p-2 rounded-lg">${t.content}</p>
                </div>
              `).join('')}
              ${todayTaskList.length === 0 ? `<p class="text-xs text-slate-300 text-center py-4">今天尚無安排工作行程</p>` : ''}
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl border shadow-xs space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="font-extrabold text-slate-900 text-sm">🗓️ 月曆總覽 (點擊日期檢視行程)</h3>
              <button onclick="openCreateTaskModal('${windowState.selectedTaskDate}')" class="bg-indigo-600 text-white px-3 py-1 rounded-xl font-bold text-xs">+ 新增行程</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs">
              ${['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="font-black py-1 ${d === '日' || d === '六' ? 'text-rose-600' : 'text-slate-500'}">週${d}</div>`).join('')}
              ${Array.from({ length: firstDayOffset }).map(() => `<div class="min-h-[75px] bg-slate-50 rounded-xl border border-dashed border-slate-200"></div>`).join('')}
              ${days.map(m => `
                <div onclick="selectCalendarDate('${m.dateStr}')" class="min-h-[75px] p-1.5 rounded-xl border text-left cursor-pointer transition-all ${windowState.selectedTaskDate === m.dateStr ? 'border-indigo-600 bg-indigo-50/70 ring-2 ring-indigo-500' : 'bg-white hover:bg-slate-50'}">

                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderSchedule() {
      const { days, fullSchedules, dailyWorkingCounts, totalRedDays } = calculateScheduleAndConflicts();
      const shiftOptionsList = ['上班', '休假', '加班', '特半', '特一', '事假', '病假', '陪產', '婚假', '喪假'];

      return `

                  <th class="p-2.5 w-44 border-r sticky left-0 bg-slate-100 z-20">同仁姓名</th>

      if (!windowState.currentUser) {

      let moduleHTML = '';
      switch (windowState.activeModule) {
        case 'announcements': moduleHTML = renderAnnouncements(); break;

        case 'attendance': moduleHTML = renderAttendance(); break;
        case 'lateReport': moduleHTML = renderLateReport(); break;
        case 'carManagement': moduleHTML = renderCarManagement(); break;

      const clockEl = document.getElementById('live-clock-display');
      if (clockEl) clockEl.textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    }, 1000);

    try {
      render();
      initFirebaseSync();
    } catch (e) {
      console.error("Boot Error:", e);
    }
  </script>
