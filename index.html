    function getHealthCheckInfo(checkDateStr) {
      if (!checkDateStr) return { status: '🔴 尚未建檔', isExpired: true, daysLeft: -999 };
      const checkDate = new Date(checkDateStr);
      const expireDate = new Date(checkDate);
      expireDate.setFullYear(expireDate.getFullYear() + 1);

      const today = new Date();
      today.setHours(0,0,0,0);

      const diffTime = expireDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { status: `🔴 體檢已過期 (${Math.abs(diffDays)}天前)`, isExpired: true, daysLeft: diffDays };
      } else if (diffDays <= 30) {
        return { status: `🟡 體檢即將到期 (剩${diffDays}天)`, isExpired: false, daysLeft: diffDays, isWarning: true };
      } else {
        return { status: `🟢 合格 (效期至 ${expireDate.toISOString().slice(0,10)})`, isExpired: false, daysLeft: diffDays };
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-500 text-slate-950';
      toast.className = `${bgClass} text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-2 pointer-events-none flex items-center justify-between min-w-[240px]`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-3 font-black text-sm opacity-80 hover:opacity-100">✕</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function initFirebaseSync() {
      if (!db) {
        render();
        return;
      }
      try {
        const docRef = doc(db, 'system', 'mainData');
        getDoc(docRef).then((docSnap) => {
          if (docSnap.exists()) {
            applyCloudData(docSnap.data());
          } else {
            saveStateToCloud();
          }
        }).catch(() => {});

        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            applyCloudData(docSnap.data());
          }
        }, () => {});
      } catch (e) {
        render();
      }
    }

    function applyCloudData(data) {
      let hasChanges = false;
      if (data.employees && JSON.stringify(data.employees) !== JSON.stringify(windowState.employees)) {
        windowState.employees = data.employees;
        hasChanges = true;
      }
      if (data.announcements && JSON.stringify(data.announcements) !== JSON.stringify(windowState.announcements)) {
        windowState.announcements = data.announcements;
        hasChanges = true;
      }
      if (data.tasks && JSON.stringify(data.tasks) !== JSON.stringify(windowState.tasks)) {
        windowState.tasks = data.tasks;
        hasChanges = true;
      }
      if (data.schedules && JSON.stringify(data.schedules) !== JSON.stringify(windowState.schedules)) {
        windowState.schedules = data.schedules;
        hasChanges = true;
      }
      if (data.clockRecords && JSON.stringify(data.clockRecords) !== JSON.stringify(windowState.clockRecords)) {
        windowState.clockRecords = data.clockRecords;
        hasChanges = true;
      }
      if (data.evaluations && JSON.stringify(data.evaluations) !== JSON.stringify(windowState.evaluations)) {
        windowState.evaluations = data.evaluations;
        hasChanges = true;
      }
      if (data.evalArchives && JSON.stringify(data.evalArchives) !== JSON.stringify(windowState.evalArchives)) {
        windowState.evalArchives = data.evalArchives;
        hasChanges = true;
      }
      if (data.logoUrl && data.logoUrl !== windowState.logoUrl) {
        windowState.logoUrl = data.logoUrl;
        hasChanges = true;
      }
      if (data.slogan && data.slogan !== windowState.slogan) {
        windowState.slogan = data.slogan;
        hasChanges = true;
      }

      if (windowState.currentUser) {
        const freshEmp = windowState.employees.find(e => e.name === windowState.currentUser.name);
        if (freshEmp) {
          windowState.currentUser = freshEmp;
          localStorage.setItem('shangyu_loginUser', JSON.stringify(freshEmp));
        }
      }

      if (hasChanges) {
        render();
      }
    }

      const map = new Map();
      const sorted = [...windowState.clockRecords].sort((a, b) => a.id - b.id);

        map.set(key, rec);

      return Array.from(map.values());

      const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false }).slice(0, 5);
      const isLate = type === 'in' && timeStr > '09:00';

      let hoursWorked = 0.0;
      let otHours = 0.0;
      const existingIn = windowState.clockRecords.find(c => c.name === windowState.currentUser.name && c.date === todayStr && c.clockIn !== '--:--');

      if (type === 'out' && existingIn) {
        const [inH, inM] = existingIn.clockIn.split(':').map(Number);
        const [outH, outM] = timeStr.split(':').map(Number);
        const diffMin = Math.max(0, (outH * 60 + outM) - (inH * 60 + inM));
        const rawHours = diffMin / 60;
        hoursWorked = Math.round(rawHours * 2) / 2;
        if (hoursWorked > 9.0) otHours = hoursWorked - 9.0;
      }

      windowState.clockRecords.unshift({
        id: Date.now(), name: windowState.currentUser.name, date: todayStr,
        expected: '09:00', clockIn: type === 'in' ? timeStr : (existingIn?.clockIn || '--:--'),
        clockOut: type === 'out' ? timeStr : '--:--',
        hoursWorked, otHours,
        status: isLate ? '⚠️ 遲到' : '🟢 正常',
        location: windowState.clockMode === 'store' ? '公司打卡' : `🚗 外勤: ${windowState.tripReason}`
      });

      showToast(`🎉 【${windowState.currentUser.name}】打卡成功！(工時：${hoursWorked}h)`);
