<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全錸蒔國際餐飲 營運管理系統</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #print-modal-area, #print-modal-area * { visibility: visible !important; }
      #print-modal-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: white !important;
        padding: 10px !important;
        margin: 0 !important;
      }
      .no-print { display: none !important; }
    }
    .shift-select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align: center;
      text-align-last: center;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="app"></div>
  <div id="print-modal-area" class="hidden print:block"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARUQy_y-QEPlm7arCJujXQBcFMDTUPBxc",
      authDomain: "shangyu-management.firebaseapp.com",
      projectId: "shangyu-management",
      storageBucket: "shangyu-management.firebasestorage.app",
      messagingSenderId: "556392754430",
      appId: "1:556392754430:web:3e75519cc30bdd454449af",
      measurementId: "G-69RTLP6MTX"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Firebase Init Warning: ", e);
    }

    const defaultLogoSvg = "data:image/svg+xml;utf8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
        <text x="100" y="50" font-family="Arial" font-size="16" font-weight="900" fill="#000" text-anchor="middle">QUAN LAI SHI</text>
        <circle cx="100" cy="120" r="50" fill="none" stroke="#000" stroke-width="6"/>
        <text x="100" y="200" font-family="Georgia" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Since 2022</text>
      </svg>
    `);

    const nowToday = new Date();
    const curYear = nowToday.getFullYear();
    const curMonth = nowToday.getMonth() + 1;
    const todayStr = `${curYear}-${String(curMonth).padStart(2,'0')}-${String(nowToday.getDate()).padStart(2,'0')}`;

    const windowState = {
      currentUser: JSON.parse(localStorage.getItem('shangyu_loginUser')) || null,
      activeModule: 'announcements',
      isAdmin: false,
      showTerminatedEmps: false,
      logoUrl: localStorage.getItem('shangyu_logo') || defaultLogoSvg,
      slogan: localStorage.getItem('shangyu_slogan') || '饌玉炊金，全錸蒔誠獻 — 傳承真摯好味道',
      scheduleYear: curYear,
      scheduleMonth: curMonth,
      selectedTaskDate: todayStr,
      selectedCardStaff: '王聖銓',
      clockMode: 'store',
      tripReason: '',
      employees: [
        { id: 'E001', name: '王聖銓', role: '亞太十大菁英名廚 / 總店長', dept: '門市/外場', type: '正職員工', status: '在職', healthCheckDate: '2025-06-15', pin: '8888', phone: '0912-345-678', emergencyContact: '王太太', emergencyPhone: '0911-111-222', address: '台北市信義區', birthday: '1988-10-15', joinDate: '2022-03-15', leaveEntitled: 10, leaveUsed: 4.5, sortOrder: 1, note: '擅長法式位上私廚料理' },
        { id: 'E002', name: '陳副店', role: '門市副店長', dept: '門市/外場', type: '正職員工', status: '在職', healthCheckDate: '2025-08-01', pin: '8888', phone: '0923-456-789', emergencyContact: '陳先生', emergencyPhone: '0922-222-333', address: '新北市板橋區', birthday: '1992-08-28', joinDate: '2023-08-01', leaveEntitled: 7, leaveUsed: 2, sortOrder: 2, note: '外場動線規劃' },
        { id: 'E003', name: '蘇冠勳', role: '活動支援人員', dept: '門市/外場', type: '兼職 (PT)', status: '在職', healthCheckDate: '2026-01-01', pin: '8888', phone: '0988-123-456', emergencyContact: '蘇家屬', emergencyPhone: '0988-654-321', address: '台北市大安區', birthday: '1995-01-01', joinDate: '2024-01-01', leaveEntitled: 3, leaveUsed: 0, sortOrder: 3, note: '調酒與活動支援' }
      ],
      announcements: [
        { id: 1, title: '🏆 賀！「全錸蒔國際餐飲」榮獲 2026 年度卓越餐飲最佳服務金獎！', level: '🔴 特急', category: '重要', isPinned: true, date: '2026-08-01', author: '總部總經理室', content: '感謝全體同仁秉持真誠理念，發放特別福利津貼以資鼓勵！' }
      ],
      tasks: [],
      schedules: {},
      clockRecords: [
        { id: 1, name: '王聖銓', date: todayStr, expected: '09:00', clockIn: '08:52', clockOut: '18:05', hoursWorked: 9.0, otHours: 0, status: '🟢 正常', location: '公司打卡' }
      ],
      evaluations: {},
      evalArchives: {},
      vehicles: [
        { id: 'V01', plate: 'ABC-8888', model: 'Toyota RAV4 (公務車A)', status: '可用', currentMileage: 45200, currentUser: '', nextInspectionDate: '2026-09-01', nextInsuranceDate: '2026-09-15', nextMaintenanceMileage: 46000 }
      ],
      vehicleLogs: [],
      customReminders: [
        { id: 1, text: '💡 淨水器濾芯上次更換：2026-05-01 (預計 11/01 到期需更換)', author: '王聖銓' }
      ],
      activeModal: null,
      modalData: {}
    };

    function getHealthCheckInfo(checkDateStr) {
      if (!checkDateStr) return { status: '🔴 尚未建檔', isExpired: true };
      const checkDate = new Date(checkDateStr);
      const expireDate = new Date(checkDate);
      expireDate.setFullYear(expireDate.getFullYear() + 1);
      const today = new Date();
      today.setHours(0,0,0,0);
      const diffDays = Math.ceil((expireDate - today) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return { status: `🔴 體檢已過期 (${Math.abs(diffDays)}天前)`, isExpired: true };
      if (diffDays <= 30) return { status: `🟡 體檢即將到期 (剩${diffDays}天)`, isExpired: false, isWarning: true };
      return { status: `🟢 合格`, isExpired: false };
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between min-w-[240px]`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function initFirebaseSync() {
      if (!db) { render(); return; }
      const docRef = doc(db, 'system', 'mainData');
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.employees) windowState.employees = data.employees;
          if (data.announcements) windowState.announcements = data.announcements;
          if (data.vehicles) windowState.vehicles = data.vehicles;
          if (data.vehicleLogs) windowState.vehicleLogs = data.vehicleLogs;
          render();
        }
      }, () => {});
    }

    async function saveStateToCloud() {
      if (!db) return;
      try {
        const docRef = doc(db, 'system', 'mainData');
        await setDoc(docRef, {
          employees: windowState.employees,
          announcements: windowState.announcements,
          vehicles: windowState.vehicles,
          vehicleLogs: windowState.vehicleLogs,
          updatedAt: serverTimestamp()
        });
        showToast("☁️ 資料已同步至雲端！");
      } catch (err) { console.error(err); }
    }

    window.switchModule = (m) => { windowState.activeModule = m; render(); };
    window.toggleAdminLock = () => { windowState.isAdmin = !windowState.isAdmin; render(); };
    window.toggleClockMode = (mode) => { windowState.clockMode = mode; render(); };

    // 1. 外勤事由即時更新
    window.executeClockAction = (type) => {
      if (windowState.clockMode === 'businessTrip') {
        const input = document.getElementById('trip-reason-input');
        windowState.tripReason = input ? input.value.trim() : '';
        if (!windowState.tripReason) return showToast('⚠️ 請填寫外勤地點與事由！', 'error');
      }
      const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false }).slice(0, 5);
      windowState.clockRecords.unshift({
        id: Date.now(), name: windowState.currentUser.name, date: todayStr,
        clockIn: type === 'in' ? timeStr : '--:--', clockOut: type === 'out' ? timeStr : '--:--',
        hoursWorked: 8.0, otHours: 0, status: '🟢 正常',
        location: windowState.clockMode === 'store' ? '公司打卡' : `🚗 外勤: ${windowState.tripReason}`
      });
      showToast('🎉 打卡成功！');
      render();
    };

    // 2. 員工順序上下調整
    window.moveEmployeeOrder = (id, dir) => {
      const active = windowState.employees.filter(e => e.status !== '離職').sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
      const idx = active.findIndex(e => e.id === id);
      if (idx < 0) return;
      const target = dir === 'up' ? idx - 1 : idx + 1;
      if (target < 0 || target >= active.length) return;
      const temp = active[idx].sortOrder;
      active[idx].sortOrder = active[target].sortOrder;
      active[target].sortOrder = temp;
      active.forEach((e, i) => e.sortOrder = (i + 1) * 10);
      saveStateToCloud();
      showToast('⚡ 員工排序已更新！');
      render();
    };

    // 3. 報表列印修復
    window.printAttendanceRecord = () => {
      const printArea = document.getElementById('print-modal-area');
      printArea.innerHTML = `<div style="padding:20px; font-family:sans-serif;"><h2>全錸蒔國際餐飲 - 員工考勤表</h2><p>列印日期：${todayStr}</p></div>`;
      window.print();
      setTimeout(() => printArea.innerHTML = '', 1000);
    };

    window.printVehicleReport = () => {
      const printArea = document.getElementById('print-modal-area');
      printArea.innerHTML = `<div style="padding:20px; font-family:sans-serif;"><h2>全錸蒔國際餐飲 - 公務車油耗報表</h2></div>`;
      window.print();
      setTimeout(() => printArea.innerHTML = '', 1000);
    };

    // 4. 公務車預警 (驗車/保險 1個月, 保養 500km)
    function getVehicleAlerts(v) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const alerts = [];
      if (v.nextInspectionDate) {
        const diff = Math.ceil((new Date(v.nextInspectionDate) - today) / (1000 * 60 * 60 * 24));
        if (diff <= 30) alerts.push(`🚨 驗車將於 ${v.nextInspectionDate} 到期 (剩${diff}天)`);
      }
      if (v.nextInsuranceDate) {
        const diff = Math.ceil((new Date(v.nextInsuranceDate) - today) / (1000 * 60 * 60 * 24));
        if (diff <= 30) alerts.push(`🚨 保險將於 ${v.nextInsuranceDate} 到期 (剩${diff}天)`);
      }
      if (v.nextMaintenanceMileage && v.currentMileage) {
        const diffKm = v.nextMaintenanceMileage - v.currentMileage;
        if (diffKm <= 500) alerts.push(`🔧 距下次保養剩 ${diffKm} 公里`);
      }
      return alerts;
    }

    function renderHeader() {
      return `
        <header class="bg-slate-900 text-white p-4 flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <h1 class="font-black text-lg">全錸蒔國際餐飲 營運管理系統</h1>
          </div>
          <div class="flex items-center space-x-2 text-xs">
            <span>👤 ${windowState.currentUser ? windowState.currentUser.name : '未登入'}</span>
            <button onclick="toggleAdminLock()" class="bg-amber-400 text-slate-950 px-3 py-1 rounded font-bold">
              ${windowState.isAdmin ? '🔓 管理員已解鎖' : '🔑 解鎖管理員'}
            </button>
          </div>
        </header>
      `;
    }

    function renderAttendance() {
      return `
        <div class="space-y-4">
          <div class="bg-slate-900 text-white p-5 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-base">🏢 考勤打卡</h3>
              <div class="flex bg-slate-800 p-1 rounded-xl text-xs font-bold">
                <button onclick="toggleClockMode('store')" class="px-3 py-1 rounded ${windowState.clockMode === 'store' ? 'bg-indigo-600 text-white' : 'text-slate-400'}">公司打卡</button>
                <button onclick="toggleClockMode('businessTrip')" class="px-3 py-1 rounded ${windowState.clockMode === 'businessTrip' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}">外勤打卡</button>
              </div>
            </div>
            ${windowState.clockMode === 'businessTrip' ? `
              <div>
                <label class="block text-amber-300 text-xs font-bold mb-1">🚗 請輸入外勤地點與事由 (空白可自行填寫)</label>
                <input type="text" id="trip-reason-input" placeholder="例: 宜蘭涵舎民宿40人外燴" class="w-full bg-slate-800 text-white p-2.5 rounded-xl border border-amber-400 text-xs" />
              </div>
            ` : ''}
            <div class="flex gap-2">
              <button onclick="executeClockAction('in')" class="flex-1 bg-emerald-500 font-bold py-2.5 rounded-xl text-xs text-slate-950">☀️ 上班打卡</button>
              <button onclick="executeClockAction('out')" class="flex-1 bg-rose-600 font-bold py-2.5 rounded-xl text-xs text-white">🌙 下班打卡</button>
            </div>
          </div>
          <div class="bg-white p-4 rounded-2xl border flex justify-between items-center">
            <h2 class="font-bold text-sm">🗓️ 考勤簽核表列印</h2>
            <button onclick="printAttendanceRecord()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">🖨️ 列印 A4 簽核表</button>
          </div>
        </div>
      `;
    }

    function renderVehicles() {
      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-2xl border flex justify-between items-center">
            <h2 class="font-bold text-sm">🚗 公務車管理與預警</h2>
            <button onclick="printVehicleReport()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">🖨️ 列印油耗總表</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${windowState.vehicles.map(v => {
              const alerts = getVehicleAlerts(v);
              return `
                <div class="bg-white p-4 rounded-2xl border space-y-2">
                  <h3 class="font-black">${v.model} (${v.plate})</h3>
                  <p class="text-xs">目前里程：<strong>${v.currentMileage} km</strong></p>
                  <p class="text-xs">驗車日：${v.nextInspectionDate} | 保險日：${v.nextInsuranceDate}</p>
                  ${alerts.length ? `<div class="bg-rose-100 p-2 rounded text-rose-800 text-xs font-bold">${alerts.join('<br>')}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!windowState.currentUser) {
        app.innerHTML = `
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-3xl max-w-sm w-full space-y-4 text-center">
              <h2 class="font-black text-lg">全錸蒔管理系統</h2>
              <select id="login-sel" class="w-full p-2.5 border rounded-xl font-bold text-xs">
                ${windowState.employees.map(e => `<option value="${e.name}">${e.name} (${e.role})</option>`).join('')}
              </select>
              <button onclick="windowState.currentUser = windowState.employees.find(e => e.name === document.getElementById('login-sel').value); localStorage.setItem('shangyu_loginUser', JSON.stringify(windowState.currentUser)); render();" class="w-full bg-amber-400 font-black py-3 rounded-xl text-xs">快速登入</button>
            </div>
          </div>
        `;
        return;
      }

      app.innerHTML = `
        <div class="min-h-screen bg-slate-100 flex justify-center py-4">
          <div class="w-full max-w-4xl bg-white min-h-[800px] rounded-3xl shadow-xl border overflow-hidden flex flex-col">
            ${renderHeader()}
            <div class="p-3 bg-slate-100 flex gap-2">
              <button onclick="windowState.activeModule='attendance'; render();" class="px-3 py-1.5 rounded-xl font-bold text-xs ${windowState.activeModule==='attendance'?'bg-amber-400 text-slate-950':'bg-white'}">員工打卡</button>
              <button onclick="windowState.activeModule='vehicles'; render();" class="px-3 py-1.5 rounded-xl font-bold text-xs ${windowState.activeModule==='vehicles'?'bg-amber-400 text-slate-950':'bg-white'}">公務車管理</button>
            </div>
            <main class="flex-1 p-4 bg-slate-50">
              ${windowState.activeModule === 'vehicles' ? renderVehicles() : renderAttendance()}
            </main>
          </div>
        </div>
      `;
    }

    render();
    initFirebaseSync();
  </script>
</body>
</html>
