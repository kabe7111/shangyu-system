    function getHealthCheckInfo(checkDateStr) {
      if (!checkDateStr) return { status: '🔴 尚未建檔', isExpired: true, daysLeft: -999 };
      const checkDate = new Date(checkDateStr);
      const expireDate = new Date(checkDate);
      expireDate.setFullYear(expireDate.getFullYear() + 1);

      const today = new Date();
      today.setHours(0,0,0,0);

      const diffTime = expireDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { status: `🔴 體檢已過期 (${Math.abs(diffDays)}天前)`, isExpired: true, daysLeft: diffDays };
      } else if (diffDays <= 30) {
        return { status: `🟡 體檢即將到期 (剩${diffDays}天)`, isExpired: false, daysLeft: diffDays, isWarning: true };
      } else {
        return { status: `🟢 合格 (效期至 ${expireDate.toISOString().slice(0,10)})`, isExpired: false, daysLeft: diffDays };
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-500 text-slate-950';
      toast.className = `${bgClass} text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-2 pointer-events-none flex items-center justify-between min-w-[240px]`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-3 font-black text-sm opacity-80 hover:opacity-100">✕</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function initFirebaseSync() {
      if (!db) {
        render();
        return;
      }
      try {
        const docRef = doc(db, 'system', 'mainData');
        getDoc(docRef).then((docSnap) => {
          if (docSnap.exists()) {
            applyCloudData(docSnap.data());
          } else {
            saveStateToCloud();
          }
        }).catch(() => {});

        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            applyCloudData(docSnap.data());
          }
        }, () => {});
      } catch (e) {
        render();
      }
    }

      }
      const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false }).slice(0, 5);
      const isLate = type === 'in' && timeStr > '09:00';

      let hoursWorked = 0.0;
      let otHours = 0.0;
      const existingIn = windowState.clockRecords.find(c => c.name === windowState.currentUser.name && c.date === todayStr && c.clockIn !== '--:--');

      if (type === 'out' && existingIn) {
        const [inH, inM] = existingIn.clockIn.split(':').map(Number);
        const [outH, outM] = timeStr.split(':').map(Number);
        const diffMin = Math.max(0, (outH * 60 + outM) - (inH * 60 + inM));
        const rawHours = diffMin / 60;
        hoursWorked = Math.round(rawHours * 2) / 2;
        if (hoursWorked > 9.0) otHours = hoursWorked - 9.0;
      }

      windowState.clockRecords.unshift({
        id: Date.now(), name: windowState.currentUser.name, date: todayStr,
        expected: '09:00', clockIn: type === 'in' ? timeStr : (existingIn?.clockIn || '--:--'),

        status: isLate ? '⚠️ 遲到' : '🟢 正常',
        location: windowState.clockMode === 'store' ? '公司打卡' : `🚗 外勤: ${windowState.tripReason}`

      windowState.employees.forEach(emp => {
        const empTasks = windowState.tasks.filter(t => t.assignees.includes(emp.name));

          efficiencyScore: 3, tripCoopScore: 3, sanitationScore: 3, knowledgeScore: 3,
          comment: '工作表現正常。'
        };

        const calculatedScore = Math.min(100, Math.max(0,
          70 + (customEval.efficiencyScore * 2) + (customEval.tripCoopScore * 2) + (customEval.sanitationScore * 2) + (customEval.knowledgeScore * 2) + (completedTaskCount * 2) - (lateCount * 5) - (uncompletedTaskCount * 3)
        ));

        currentMonthEvals[emp.name] = {
          role: emp.role,
          ...customEval,
          completedTaskCount,
          uncompletedTaskCount,
          lateCount,
          totalScore: calculatedScore
        };
      });

      if (!windowState.evalArchives) windowState.evalArchives = {};
      windowState.evalArchives[archiveKey] = currentMonthEvals;

              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">主管綜合評語</label>
                <textarea id="eval-comment" rows="3" required placeholder="請輸入主管評語" class="w-full p-2.5 border rounded-xl text-xs font-bold text-indigo-950">${ev.comment || ''}</textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-600 cursor-pointer">取消</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold cursor-pointer">儲存評語與星級</button>
              </div>
            </form>
          </div>
        `;
      }

      if (windowState.activeModal === 'annModal') {
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleSaveAnnSubmit(event)" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
              <h3 class="font-bold text-base text-slate-900">📢 發布總部公告</h3>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">發布單位</label>
                <input type="text" id="ann-author-input" value="總部總經理室" class="w-full p-2.5 border rounded-xl text-xs font-bold" />
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1">公告等級</label>
                <select id="ann-level-sel" class="w-full p-2 border rounded-xl text-xs font-bold">
                  <option value="🔴 特急">🔴 特急/緊急</option>
                  <option value="🟠 重要">🟠 重要通知</option>
                  <option value="🔵 常規">🔵 一般常規</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">公告標題</label>
                <input type="text" id="ann-title-input" required placeholder="請輸入標題" class="w-full p-2.5 border rounded-xl text-xs" />
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">📷 上傳圖片/海報圖檔</label>
                <input type="file" accept="image/*" onchange="handleAnnImageUploadInModal(event)" class="w-full p-1 border rounded-xl text-xs" />
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">公告詳細內容</label>
                <textarea id="ann-content-input" rows="3" required placeholder="請輸入詳細內容" class="w-full p-2.5 border rounded-xl text-xs"></textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-600 cursor-pointer">取消</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold cursor-pointer">發布公告</button>
              </div>
            </form>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!windowState.currentUser) {
        app.innerHTML = renderLoginView();
        return;
      }

      let moduleHTML = '';
      switch (windowState.activeModule) {
        case 'announcements': moduleHTML = renderAnnouncements(); break;
        case 'tasks': moduleHTML = renderTasks(); break;
        case 'schedule': moduleHTML = renderSchedule(); break;
        case 'attendance': moduleHTML = renderAttendance(); break;
        case 'lateReport': moduleHTML = renderLateReport(); break;
        case 'carManagement': moduleHTML = renderCarManagement(); break;
        case 'hrRoster': moduleHTML = renderHrRoster(); break;
        case 'evaluation': moduleHTML = renderEvaluations(); break;
        case 'annualEval': moduleHTML = renderAnnualEvaluation(); break;
        default: moduleHTML = renderAnnouncements();
      }

      app.innerHTML = `
        <div class="min-h-screen bg-slate-100 flex justify-center py-0 sm:py-6 font-sans">
          <div class="w-full max-w-5xl bg-white min-h-screen sm:min-h-[900px] sm:rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
            ${renderHeader()}
            <main class="flex-1 p-4 sm:p-5 space-y-5 bg-slate-50/70 overflow-y-auto">
              ${moduleHTML}
            </main>
          </div>
        </div>
        ${renderModals()}
      `;
    }

    setInterval(() => {
      const clockEl = document.getElementById('live-clock-display');
      if (clockEl) clockEl.textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    }, 1000);

    try {
      render();
      initFirebaseSync();
    } catch (e) {
      console.error("Boot Error:", e);
    }
  </script>
</body>
</html>
