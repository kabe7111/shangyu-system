    function getHealthCheckInfo(checkDateStr) {
      if (!checkDateStr) return { status: '🔴 尚未建檔', isExpired: true, daysLeft: -999 };
      const checkDate = new Date(checkDateStr);
      const expireDate = new Date(checkDate);
      expireDate.setFullYear(expireDate.getFullYear() + 1);

      const today = new Date();
      today.setHours(0,0,0,0);

      const diffTime = expireDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { status: `🔴 體檢已過期 (${Math.abs(diffDays)}天前)`, isExpired: true, daysLeft: diffDays };
      } else if (diffDays <= 30) {
        return { status: `🟡 體檢即將到期 (剩${diffDays}天)`, isExpired: false, daysLeft: diffDays, isWarning: true };
      } else {
        return { status: `🟢 合格 (效期至 ${expireDate.toISOString().slice(0,10)})`, isExpired: false, daysLeft: diffDays };
      }
    }

      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-3 font-black text-sm opacity-80 hover:opacity-100">✕</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function initFirebaseSync() {

          } else {

        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            applyCloudData(docSnap.data());
          }
        }, () => {});
      } catch (e) {
        render();
      }
    }

    window.executeClockAction = (type) => {
      if (windowState.clockMode === 'businessTrip' && !windowState.tripReason.trim()) {
        return showToast('⚠️ 請務必填寫外勤地點與事由！', 'warning');
      }
      const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false }).slice(0, 5);
      const isLate = type === 'in' && timeStr > '09:00';

      let hoursWorked = 0.0;
      let otHours = 0.0;
      const existingIn = windowState.clockRecords.find(c => c.name === windowState.currentUser.name && c.date === todayStr && c.clockIn !== '--:--');

      if (type === 'out' && existingIn) {
        const [inH, inM] = existingIn.clockIn.split(':').map(Number);
        const [outH, outM] = timeStr.split(':').map(Number);
        const diffMin = Math.max(0, (outH * 60 + outM) - (inH * 60 + inM));
        const rawHours = diffMin / 60;
        hoursWorked = Math.round(rawHours * 2) / 2;
        if (hoursWorked > 9.0) otHours = hoursWorked - 9.0;
      }

      windowState.clockRecords.unshift({
        id: Date.now(), name: windowState.currentUser.name, date: todayStr,
        expected: '09:00', clockIn: type === 'in' ? timeStr : (existingIn?.clockIn || '--:--'),
        clockOut: type === 'out' ? timeStr : '--:--',
        hoursWorked, otHours,
        status: isLate ? '⚠️ 遲到' : '🟢 正常',
        location: windowState.clockMode === 'store' ? '公司打卡' : `🚗 外勤: ${windowState.tripReason}`
      });

      showToast(`🎉 【${windowState.currentUser.name}】打卡成功！(工時：${hoursWorked}h)`);

      const archiveKey = `${windowState.scheduleYear}-${windowState.scheduleMonth}`;
      
      const uniqueRecords = getUniqueClockRecords();
      const currentMonthEvals = {};

      windowState.employees.forEach(emp => {
        const empTasks = windowState.tasks.filter(t => t.assignees.includes(emp.name));
        const completedTaskCount = empTasks.filter(t => t.status === '已完成').length;
        const uncompletedTaskCount = empTasks.filter(t => t.status !== '已完成' && t.date <= todayStr).length;

        const lateCount = empClocks.filter(c => c.status.includes('遲到')).length;

        const customEval = windowState.evaluations[emp.name] || {
          efficiencyScore: 3, tripCoopScore: 3, sanitationScore: 3, knowledgeScore: 3,
          comment: '工作表現正常。'
        };

        const calculatedScore = Math.min(100, Math.max(0,
          70 + (customEval.efficiencyScore * 2) + (customEval.tripCoopScore * 2) + (customEval.sanitationScore * 2) + (customEval.knowledgeScore * 2) + (completedTaskCount * 2) - (lateCount * 5) - (uncompletedTaskCount * 3)
        ));

        currentMonthEvals[emp.name] = {
          role: emp.role,
          ...customEval,
          completedTaskCount,
          uncompletedTaskCount,
          lateCount,
          totalScore: calculatedScore
        };
      });

      if (!windowState.evalArchives) windowState.evalArchives = {};
      windowState.evalArchives[archiveKey] = currentMonthEvals;
      saveStateToCloud();
      showToast(`🎉 成功將【${windowState.scheduleYear} 年 ${windowState.scheduleMonth} 月】考核紀錄封存入庫！`);

      }
      if (confirm('確定要從車庫刪除這台公務車嗎？')) {
        windowState.cars = windowState.cars.filter(c => c.id !== carId);
        localStorage.setItem('car_list', JSON.stringify(windowState.cars));
        saveStateToCloud();
        showToast('🗑️ 車輛已刪除');
        render();
      }
    };

    window.openCarBorrowModal = (carId) => {
      const car = windowState.cars.find(c => c.id === carId);
      if (!car) return;
      windowState.modalData = { carId, destination: '', startMileage: car.currentMileage };
      windowState.activeModal = 'carBorrowModal';
      render();
    };

    window.handleBorrowCarSubmit = (e) => {
      e.preventDefault();
      const m = windowState.modalData;
      const dest = document.getElementById('borrow-destination').value.trim();
      const mileage = Number(document.getElementById('borrow-mileage').value);

      windowState.cars = windowState.cars.map(c => c.id === m.carId ? {
        ...c, status: 'in-use', currentMileage: mileage, currentDriver: windowState.currentUser.name
      } : c);

      const newRec = {
        id: 'rec_' + Date.now(),
        carId: m.carId,
        plate: windowState.cars.find(c => c.id === m.carId)?.plate,
        driver: windowState.currentUser.name,
        startDate: todayStr,
        startTime: new Date().toTimeString().substring(0, 5),
        startMileage: mileage,
        returnDate: null,
        returnTime: null,
        returnMileage: null,
        isRefuel: false,
        refuelLiters: 0,
        refuelCost: 0,
        notes: dest
      };

      windowState.carRecords.unshift(newRec);
      localStorage.setItem('car_list', JSON.stringify(windowState.cars));
      localStorage.setItem('car_records', JSON.stringify(windowState.carRecords));

      saveStateToCloud();
      windowState.activeModal = null;
      showToast('🚗 公務車出發登記成功！');
      render();
    };

    window.returnCarAction = (carId) => {
      const car = windowState.cars.find(c => c.id === carId);
      if (!car) return;
      const record = windowState.carRecords.find(r => r.carId === carId && r.returnMileage === null);
      if (!record) {
        showToast('找不到對應的出發紀錄', 'error');
        return;
      }

      windowState.modalData = { recordId: record.id, carId, startMileage: record.startMileage, plate: car.plate };
      windowState.activeModal = 'carReturnModal';
      render();
    };

    window.handleReturnCarSubmit = (e) => {
      e.preventDefault();
      const m = windowState.modalData;
      const returnMileage = parseInt(document.getElementById('modal-return-mileage').value);
      const isRefuel = document.getElementById('modal-is-refuel')?.checked || false;
      const refuelLiters = isRefuel ? parseFloat(document.getElementById('modal-refuel-liters').value) || 0 : 0;
      const refuelCost = isRefuel ? parseFloat(document.getElementById('modal-refuel-cost').value) || 0 : 0;
      const notes = document.getElementById('modal-notes').value;

      if (returnMileage < m.startMileage) {
        alert('❌ 歸還里程數不可小於出發里程數！');
        return;
      }

      const record = windowState.carRecords.find(r => r.id === m.recordId);
      if (record) {
        record.returnDate = todayStr;
        record.returnTime = new Date().toTimeString().substring(0, 5);
        record.returnMileage = returnMileage;
        record.isRefuel = isRefuel;
        record.refuelLiters = refuelLiters;
        record.refuelCost = refuelCost;
        record.notes = notes || '車況正常';
      }

      const car = windowState.cars.find(c => c.id === m.carId);
      if (car) {
        car.currentMileage = returnMileage;
        car.status = 'available';
        car.currentDriver = '';
      }

      localStorage.setItem('car_list', JSON.stringify(windowState.cars));
      localStorage.setItem('car_records', JSON.stringify(windowState.carRecords));
      saveStateToCloud();
      windowState.activeModal = null;
      showToast('✅ 還車登記已完成！');
      render();
    };

    window.toggleModalRefuelFields = () => {
      const isChecked = document.getElementById('modal-is-refuel')?.checked;
      const container = document.getElementById('modal-refuel-details');
      if (container) {
        if (isChecked) container.classList.remove('hidden');
        else container.classList.add('hidden');
      }
    };

    window.resetService = (carId) => {
      const car = windowState.cars.find(c => c.id === carId);
      if (car) {
        car.lastServiceMileage = car.currentMileage;
        localStorage.setItem('car_list', JSON.stringify(windowState.cars));
        saveStateToCloud();
        showToast(`已更新 ${car.plate} 的保養紀錄！`);
        render();
      }
    };

    window.deleteCarRecord = (id) => {
      if (confirm('確定要刪除這筆用車紀錄嗎？')) {
        const rec = windowState.carRecords.find(r => r.id === id);
        if (rec && rec.returnMileage === null) {
          const car = windowState.cars.find(c => c.id === rec.carId);
          if (car) { car.status = 'available'; car.currentDriver = ''; }
        }
        windowState.carRecords = windowState.carRecords.filter(r => r.id !== id);
        localStorage.setItem('car_records', JSON.stringify(windowState.carRecords));
        saveStateToCloud();
        showToast('紀錄已刪除');
        render();
      }
    };

    window.exportCarCSV = () => {
      const records = windowState.carRecords || [];
      if (records.length === 0) {
        showToast('目前沒有可匯出的紀錄', 'error');
        return;
      }
      let csvContent = "\uFEFF" + "車牌,駕駛人,出發日期,出發時間,出發里程,歸還日期,歸還時間,歸還里程,行駛距離,是否加油,加油公升數,加油金額,備註\n";
      records.forEach(r => {
        const distance = r.returnMileage !== null ? (r.returnMileage - r.startMileage) : '';
        const row = [
          r.plate, r.driver, r.startDate, r.startTime, r.startMileage,
          r.returnDate || '', r.returnTime || '', r.returnMileage !== null ? r.returnMileage : '',
          distance, r.isRefuel ? '是' : '否', r.refuelLiters || '', r.refuelCost || '',
          `"${(r.notes || '').replace(/"/g, '""')}"`
        ];
        csvContent += row.join(",") + "\n";
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `公務車完整報表_${todayStr}.csv`);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('完整報表匯出成功！');
    };

    // 公務車模組介面渲染函式
    function renderCarManagement() {
      const cars = windowState.cars || [];
      const records = windowState.carRecords || [];
      const totalDistance = records.reduce((acc, r) => (r.returnMileage !== null && r.returnMileage >= r.startMileage) ? acc + (r.returnMileage - r.startMileage) : acc, 0);
      const totalCost = records.reduce((acc, r) => acc + (r.refuelCost || 0), 0);

      return `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 class="text-lg font-black text-slate-900">🚗 公務車企業管理與使用登記</h2>
              <p class="text-xs text-slate-500 mt-0.5">可隨時新增車輛、設定自訂保養公里提醒、上傳照片與分段還車</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
              <span class="text-xs bg-indigo-50 text-indigo-700 font-bold px-3 py-1.5 rounded-xl border border-indigo-200">總行駛：${totalDistance.toLocaleString()} km</span>
              <span class="text-xs bg-amber-50 text-amber-800 font-bold px-3 py-1.5 rounded-xl border border-amber-200">總油資：$${totalCost.toLocaleString()}</span>
              <button onclick="openAddCarModal()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-sm cursor-pointer">
                <i class="fa-solid fa-plus mr-1"></i> 新增公務車
              </button>
              <button onclick="exportCarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-sm cursor-pointer">
                <i class="fa-solid fa-file-excel mr-1"></i> 匯出 CSV
              </button>
            </div>
          </div>

          <!-- 車輛狀態與設定卡片 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${cars.map(car => {
              const interval = car.serviceInterval || 5000;
              const kmSinceService = car.currentMileage - (car.lastServiceMileage || 0);
              const needsService = kmSinceService >= interval;
              const isInUse = car.status === 'in-use';

              return `
                <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-4 ${isInUse ? 'border-amber-400 bg-amber-50/20' : 'border-slate-200'}">
                  <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                      ${car.photoUrl ? `
                        <img src="${car.photoUrl}" class="w-12 h-12 rounded-2xl object-cover border" />
                      ` : `
                        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
                          <i class="fa-solid fa-car text-lg"></i>
                        </div>
                      `}
                      <div>
                        <h3 class="font-black text-slate-900 text-base">${car.plate}</h3>
                        <p class="text-xs text-slate-500">${car.model} (保養門檻: ${interval}km)</p>
                      </div>
                    </div>
                    <div class="flex flex-col items-end gap-1">
                      <span class="px-3 py-1 rounded-xl font-black text-xs ${isInUse ? 'bg-amber-500 text-slate-950 animate-pulse' : 'bg-emerald-600 text-white'}">
                        ${isInUse ? `使用中 (${car.currentDriver || '駕駛'})` : '停放中'}
                      </span>
                      ${windowState.isAdmin ? `
                        <div class="flex gap-1 mt-1">
                          <button onclick="openEditCarModal('${car.id}')" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold cursor-pointer">✏️ 編輯</button>
                          <button onclick="deleteCar('${car.id}')" class="text-[10px] bg-rose-100 hover:bg-rose-200 text-rose-700 px-2 py-0.5 rounded font-bold cursor-pointer">🗑️ 刪除</button>
                        </div>
                      ` : ''}
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-2xl border text-slate-600">
                    <div>當前里程：<strong class="font-mono text-slate-900">${car.currentMileage.toLocaleString()} km</strong></div>
                    <div>距上次保養：<strong class="font-mono ${needsService ? 'text-rose-600 font-black' : 'text-indigo-700'}">${kmSinceService.toLocaleString()} km</strong></div>
                  </div>

                  <div class="flex justify-between items-center pt-1">
                    <button onclick="resetService('${car.id}')" class="text-slate-400 hover:text-indigo-600 text-xs font-bold transition cursor-pointer">
                      <i class="fa-solid fa-wrench mr-1"></i> 登記已保養
                    </button>
                    ${isInUse ? `
                      <button onclick="returnCarAction('${car.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs cursor-pointer shadow">
                        ✅ 填寫還車登記
                      </button>
                    ` : `
                      <button onclick="openCarBorrowModal('${car.id}')" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs cursor-pointer shadow">
                        🔑 登記出發借用
                      </button>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- 用車紀錄表格 -->
          <div class="bg-white p-6 rounded-3xl border shadow-sm space-y-3">
            <h3 class="font-extrabold text-slate-900 text-sm">📋 用車紀錄與還車管理</h3>
            <div class="overflow-x-auto border rounded-2xl">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-slate-100 border-b text-slate-700">
                  <tr>
                    <th class="p-3 border-r">車牌 / 駕駛人</th>
                    <th class="p-3 border-r">出發資訊</th>
                    <th class="p-3 border-r">歸還資訊</th>
                    <th class="p-3 border-r">行駛里程 / 油耗</th>
                    <th class="p-3 border-r">備註 / 事由</th>
                    <th class="p-3 text-center">操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${records.map(r => {
                    const isReturned = r.returnMileage !== null;
                    const distance = isReturned ? (r.returnMileage - r.startMileage) : '-';
                    let fuelInfo = '-';
                    if (isReturned && r.isRefuel) {
                      const kmPerLiter = (distance !== '-' && r.refuelLiters > 0) ? (distance / r.refuelLiters).toFixed(1) : '-';
                      fuelInfo = `<div class="text-[11px] text-amber-700 font-bold">加油: ${r.refuelLiters}L / $${r.refuelCost} (${kmPerLiter} km/L)</div>`;
                    }
                    return `
                      <tr class="border-b hover:bg-slate-50">
                        <td class="p-3 border-r">
                          <div class="font-bold text-slate-900">${r.plate}</div>
                          <div class="text-[11px] text-slate-500">👤 ${r.driver}</div>
                        </td>
                        <td class="p-3 border-r font-mono text-[11px]">
                          <div>${r.startDate} ${r.startTime}</div>
                          <div class="text-slate-500">${r.startMileage.toLocaleString()} km</div>
                        </td>
                        <td class="p-3 border-r font-mono text-[11px]">
                          ${isReturned ? `
                            <div>${r.returnDate} ${r.returnTime}</div>
                            <div class="text-slate-500">${r.returnMileage.toLocaleString()} km</div>
                          ` : `
                            <button onclick="returnCarAction('${r.carId}')" class="px-3 py-1.5 bg-amber-500 text-slate-950 font-black rounded-xl text-xs shadow-sm animate-pulse cursor-pointer">
                              <i class="fa-solid fa-car-on mr-1"></i> 填寫還車
                            </button>
                          `}
                        </td>
                        <td class="p-3 border-r font-mono">
                          <div class="font-extrabold text-indigo-700">${distance !== '-' ? distance.toLocaleString() + ' km' : '-'}</div>
                          ${fuelInfo}
                        </td>
                        <td class="p-3 border-r text-slate-600 max-w-xs truncate" title="${r.notes}">${r.notes || '-'}</td>
                        <td class="p-3 text-center">
                          <button onclick="deleteCarRecord('${r.id}')" class="text-slate-400 hover:text-rose-600 p-1 font-bold cursor-pointer">🗑️</button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                  ${records.length === 0 ? `<tr><td colspan="6" class="p-6 text-center text-slate-400">尚無用車紀錄</td></tr>` : ''}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!windowState.currentUser) {
        app.innerHTML = renderLoginView();
        return;
      }

      let moduleHTML = '';
      switch (windowState.activeModule) {
        case 'announcements': moduleHTML = renderAnnouncements(); break;
        case 'tasks': moduleHTML = renderTasks(); break;
        case 'schedule': moduleHTML = renderSchedule(); break;
        case 'attendance': moduleHTML = renderAttendance(); break;
        case 'lateReport': moduleHTML = renderLateReport(); break;
        case 'carManagement': moduleHTML = renderCarManagement(); break;
        case 'hrRoster': moduleHTML = renderHrRoster(); break;
        case 'evaluation': moduleHTML = renderEvaluations(); break;
        case 'annualEval': moduleHTML = renderAnnualEvaluation(); break;
        default: moduleHTML = renderAnnouncements();
      }

      app.innerHTML = `
        <div class="min-h-screen bg-slate-100 flex justify-center py-0 sm:py-6 font-sans">
          <div class="w-full max-w-5xl bg-white min-h-screen sm:min-h-[900px] sm:rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
            ${renderHeader()}
            <main class="flex-1 p-4 sm:p-5 space-y-5 bg-slate-50/70 overflow-y-auto">
              ${moduleHTML}
            </main>
          </div>
        </div>
        ${renderModals()}
      `;
    }

    setInterval(() => {
      const clockEl = document.getElementById('live-clock-display');
      if (clockEl) clockEl.textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    }, 1000);

    try {
      render();
      initFirebaseSync();
    } catch (e) {
      console.error("Boot Error:", e);
    }
  </script>
</body>
</html>
