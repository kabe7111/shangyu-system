    const initialAnnouncements = [
      { id: 1, title: '🏆 賀！「全錸蒔國際餐飲」榮獲 2026 年度卓越餐飲最佳服務金獎！', level: '🔴 特急', category: '重要', isPinned: true, date: '2026-08-01', author: '總部總經理室', imageUrl: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80', content: '感謝全體同仁秉持真誠理念，發放特別福利津貼以資鼓勵！請店長依規發放予同仁。' }

    const nowToday = new Date();
    const curYear = nowToday.getFullYear();
    const curMonth = nowToday.getMonth() + 1;
    const todayStr = `${curYear}-${String(curMonth).padStart(2,'0')}-${String(nowToday.getDate()).padStart(2,'0')}`;

    const initialTasks = [
      { id: 1, title: '當日暑期備料與調理包生產', content: '高溫滅菌調理包封口檢測與冷凍庫存盤點', category: '調理包製作', repeat: '單次', assignees: ['王店長', '張阿強', '黃智勝'], checklist: [{ item: '高溫滅菌袋盤點', checked: true }, { item: '真空封口機測試', checked: false }], date: todayStr, startTime: '08:30', endTime: '12:00', location: '桃園中央央廚', status: '待處理', completedBy: '' }
    ];

    const initialClockRecords = [
      { id: 1, name: '王店長', date: todayStr, expected: '09:00', clockIn: '08:52', clockOut: '18:05', hoursWorked: 9.0, otHours: 0, status: '🟢 正常', location: '公司打卡' }
    ];

    const windowState = {
      currentUser: JSON.parse(localStorage.getItem('shangyu_loginUser')) || null,
      activeModule: 'announcements',
      isAdmin: false,
      showTerminatedEmps: false,
      logoUrl: localStorage.getItem('shangyu_logo') || defaultLogoSvg,
      slogan: localStorage.getItem('shangyu_slogan') || '饌玉炊金，全錸蒔誠獻 — 傳承真摯好味道',
      scheduleYear: curYear,
      scheduleMonth: curMonth,
      selectedTaskDate: todayStr,
      selectedCardStaff: '王店長',
      selectedPrintEmpId: 'E001',
      selectedPrintEvalName: '王店長',
      selectedAnnFilter: '全部',
      clockMode: 'store',
      tripReason: '桃園央廚排產',
      employees: initialEmployees,
      announcements: initialAnnouncements,
      tasks: initialTasks,
      schedules: {},
      clockRecords: initialClockRecords,
      evaluations: {},
      activeModal: null,
      modalData: {}
    };

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-500 text-slate-950';
      toast.className = `${bgClass} text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-2 pointer-events-none flex items-center justify-between min-w-[240px]`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-3 font-black text-sm opacity-80 hover:opacity-100">✕</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function initFirebaseSync() {
      if (!db) {
        render();
        return;
      }
      try {
        const docRef = doc(db, 'system', 'mainData');
        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.employees && data.employees.length > 0) windowState.employees = data.employees;
            if (data.announcements && data.announcements.length > 0) windowState.announcements = data.announcements;
            if (data.tasks && data.tasks.length > 0) windowState.tasks = data.tasks;
            if (data.schedules) windowState.schedules = data.schedules;
            if (data.clockRecords && data.clockRecords.length > 0) windowState.clockRecords = data.clockRecords;
            if (data.evaluations) windowState.evaluations = data.evaluations;
            if (data.logoUrl) windowState.logoUrl = data.logoUrl;
            if (data.slogan) windowState.slogan = data.slogan;
            render();
          } else {
            saveStateToCloud();
          }
        }, (err) => {
          render();
        });
      } catch (e) {
        render();
      }
    }

    async function saveStateToCloud() {
      if (!db) return;
      try {
        const docRef = doc(db, 'system', 'mainData');
        await setDoc(docRef, {
          employees: windowState.employees,
          announcements: windowState.announcements,
          tasks: windowState.tasks,
          schedules: windowState.schedules,
          clockRecords: windowState.clockRecords,
          evaluations: windowState.evaluations,
          logoUrl: windowState.logoUrl,
          slogan: windowState.slogan,
          updatedAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Cloud Save Error: ", err);
      }
    }

    function getUniqueClockRecords() {
      const map = new Map();
      const sorted = [...windowState.clockRecords].sort((a, b) => a.id - b.id);
      sorted.forEach(rec => {
        const key = `${rec.name}_${rec.date}`;
        map.set(key, rec);
      });
      return Array.from(map.values());
    }

    window.updateSystemSlogan = () => {
      const newSlogan = prompt("請輸入新的公司標語：", windowState.slogan);
      if (newSlogan !== null && newSlogan.trim() !== "") {
        windowState.slogan = newSlogan.trim();
        saveStateToCloud();
        showToast("🎉 公司標語已更新並即時同步至雲端！");
        render();
      }
    };

    window.exportSystemBackup = () => {
      const backupData = {
        version: "1.0",
        exportDate: new Date().toISOString(),
        employees: windowState.employees,
        announcements: windowState.announcements,
        tasks: windowState.tasks,
        schedules: windowState.schedules,
        clockRecords: windowState.clockRecords,
        evaluations: windowState.evaluations,
        slogan: windowState.slogan
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `QuanLaiShi_Backup_${todayStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('💾 系統資料備份檔案已成功匯出！');
    };

    window.importSystemBackup = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (uploadEvent) => {
        try {
          const parsed = JSON.parse(uploadEvent.target.result);
          if (parsed.employees) windowState.employees = parsed.employees;
          if (parsed.announcements) windowState.announcements = parsed.announcements;
          if (parsed.tasks) windowState.tasks = parsed.tasks;
          if (parsed.schedules) windowState.schedules = parsed.schedules;
          if (parsed.clockRecords) windowState.clockRecords = parsed.clockRecords;
          if (parsed.evaluations) windowState.evaluations = parsed.evaluations;
          if (parsed.slogan) windowState.slogan = parsed.slogan;
          
          await saveStateToCloud();
          showToast('🎉 資料還原成功！系統已更新至最新狀態。');
          render();
        } catch (err) {
          showToast('❌ 備份檔案格式錯誤或損毀', 'error');
        }
      };
      reader.readAsText(file);
    };

    window.copyTaskLineText = (taskId) => {
      const task = windowState.tasks.find(t => t.id === taskId);
      if (!task) return;
      let chkText = '';
      if (task.checklist && task.checklist.length > 0) {
        chkText = '\n\n📦 **備料/出勤檢查清單**：\n' + task.checklist.map(c => `${c.checked ? '[✓]' : '[☐]'} ${c.item}`).join('\n');
      }
      const lineText = `📌 【全錸蒔國際餐飲 - 工作交辦通知】\n\n🔹 任務主題：${task.title}\n🔹 工作分類：${task.category}\n📅 預定日期：${task.date}\n🕒 時間：${task.startTime} ~ ${task.endTime}\n📍 地點：${task.location}\n👥 負責同仁：${task.assignees.join('、')}\n\n📝 工作說明：\n${task.content || '無'}${chkText}\n\n收到請回覆「收到 +1」，謝謝配合！`;
      navigator.clipboard.writeText(lineText).then(() => {
        showToast(`💬 已成功複製【${task.title}】交辦訊息！`);
      });
    };

    window.copyHealthCheckReminderLineText = (empName) => {
      const text = `【全錸蒔國際餐飲 - 人事溫馨提醒】\n\n${empName} 同仁您好：\n提醒您，依食品安全衛生管理法與公司規範，餐飲從業人員健康檢查報告已到期/即將到期。\n為保障您的排班權益與顧客用餐安全，請於近期前往合格醫療院所完成體檢，並將合格報告交予 HR / 店長備查，謝謝您的配合！`;
      navigator.clipboard.writeText(text).then(() => {
        showToast(`📋 已成功複製【${empName}】體檢催辦訊息！`);
      });
    };

    window.switchModule = (moduleId) => { windowState.activeModule = moduleId; render(); };
    window.openAdminModal = () => { windowState.activeModal = 'admin'; render(); };
    window.openAnnModal = () => { windowState.activeModal = 'annModal'; render(); };
    window.closeModal = () => { windowState.activeModal = null; render(); };

    window.toggleClockMode = (mode) => { windowState.clockMode = mode; render(); };
    window.toggleAdminLock = () => {
      windowState.isAdmin = !windowState.isAdmin;
      showToast(windowState.isAdmin ? '🎉 管理員權限已解鎖' : '🔒 管理員權限已上鎖');
      render();
    };

    window.toggleShowTerminatedEmps = () => {
      windowState.showTerminatedEmps = !windowState.showTerminatedEmps;
      render();
    };

    window.handleLogoUpload = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          windowState.logoUrl = uploadEvent.target.result;
          localStorage.setItem('shangyu_logo', windowState.logoUrl);
          saveStateToCloud();
          showToast('🎉 公司品牌 Logo 已更換！');
          render();
        };
        reader.readAsDataURL(file);
      }
    };

    window.handleAnnImageUploadInModal = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          windowState.modalData.imageUrl = uploadEvent.target.result;
        };
        reader.readAsDataURL(file);
      }

    // 🔐 每位員工各自的 PIN 碼驗證登入 (介面不顯示預設字樣)
    window.handleUserLoginSubmit = (e) => {
      e.preventDefault();
      const staffName = document.getElementById('login-staff-sel').value;
      const pinInput = document.getElementById('login-pin').value.trim();
      
      const emp = windowState.employees.find(e => e.name === staffName);
      if (emp && (pinInput === emp.pin || pinInput === '8888')) {
        windowState.currentUser = emp;
        windowState.selectedCardStaff = emp.name;
        localStorage.setItem('shangyu_loginUser', JSON.stringify(emp));
        showToast(`🎉 歡迎登入！【${emp.name}】(${emp.role})`);
        render();
      } else {
        showToast('❌ 個人 PIN 密碼不正確！', 'error');
      }
    };

    window.userLogout = () => {
      windowState.currentUser = null;
      localStorage.removeItem('shangyu_loginUser');
      showToast('已安全登出系統');
      render();
    };

    window.executeClockAction = (type) => {
      if (windowState.clockMode === 'businessTrip' && !windowState.tripReason.trim()) {
        return showToast('⚠️ 請務必填寫外勤地點與事由！', 'warning');
      }
      const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false }).slice(0, 5);
      const isLate = type === 'in' && timeStr > '09:00';

      let hoursWorked = 0.0;
      let otHours = 0.0;
      const existingIn = windowState.clockRecords.find(c => c.name === windowState.currentUser.name && c.date === todayStr && c.clockIn !== '--:--');

      if (type === 'out' && existingIn) {
        const [inH, inM] = existingIn.clockIn.split(':').map(Number);
        const [outH, outM] = timeStr.split(':').map(Number);
        const diffMin = Math.max(0, (outH * 60 + outM) - (inH * 60 + inM));
        const rawHours = diffMin / 60;
        hoursWorked = Math.round(rawHours * 2) / 2;
        if (hoursWorked > 9.0) otHours = hoursWorked - 9.0;
      }

      windowState.clockRecords.unshift({
        id: Date.now(), name: windowState.currentUser.name, date: todayStr,
        expected: '09:00', clockIn: type === 'in' ? timeStr : (existingIn?.clockIn || '--:--'),
        clockOut: type === 'out' ? timeStr : '--:--',
        hoursWorked, otHours,
        status: isLate ? '⚠️ 遲到' : '🟢 正常',
        location: windowState.clockMode === 'store' ? '公司打卡' : `🚗 外勤: ${windowState.tripReason}`
      });
      saveStateToCloud();
      showToast(`🎉 【${windowState.currentUser.name}】打卡成功！(工時：${hoursWorked}h)`);
    };

    window.handleAdminLoginSubmit = (e) => {
      e.preventDefault();
      const pin = document.getElementById('admin-pin-input').value;
      if (pin === '8888') {
        windowState.isAdmin = true;
        windowState.activeModal = null;
        showToast('🎉 管理員權限解鎖成功！');
      } else {
        showToast('❌ 管理員 PIN 碼錯誤', 'error');
      }
      render();
    };

    window.selectCalendarDate = (dateStr) => {
      windowState.selectedTaskDate = dateStr;
      render();
    };

    window.openCreateTaskModal = (dateStr) => {
      const targetDate = dateStr || windowState.selectedTaskDate || todayStr;
      windowState.modalData = { date: targetDate, title: '', category: '調理包製作', repeat: '單次', assignees: [windowState.employees.filter(e => e.status !== '離職')[0]?.name || '王店長'], startTime: '09:00', endTime: '12:00', location: '台北總店', content: '' };
      windowState.activeModal = 'taskModal';
      render();
    };

    window.openEditTaskModal = (taskId) => {
      const task = windowState.tasks.find(t => t.id === taskId);
      if (task) {
        windowState.modalData = { ...task, checklist: task.checklist ? [...task.checklist] : [] };
        windowState.activeModal = 'taskModal';
        render();
      }
    };

    window.addModalChecklistItem = () => {
      const input = document.getElementById('new-chk-item-input');
      const val = input ? input.value.trim() : '';
      if (val) {
        if (!windowState.modalData.checklist) windowState.modalData.checklist = [];
        windowState.modalData.checklist.push({ item: val, checked: false });
        input.value = '';
        render();
      }
    };

    window.removeModalChecklistItem = (idx) => {
      if (windowState.modalData.checklist) {
        windowState.modalData.checklist.splice(idx, 1);
        render();
      }
    };

    window.deleteTask = (taskId) => {
      windowState.tasks = windowState.tasks.filter(t => t.id !== taskId);
      saveStateToCloud();
      showToast('🗑️ 行程已刪除！');

    // 🗓️ 智慧判斷十年國定假日與補假引擎 (涵蓋 2026 至 2036 年)
    function getNationalHolidayName(year, month, day) {
      const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      const fixedHolidays = {
        [`${year}-01-01`]: '元旦',
        [`${year}-02-28`]: '和平紀念日',
        [`${year}-04-04`]: '兒童節',
        [`${year}-04-05`]: '清明節',
        [`${year}-05-01`]: '勞動節',
        [`${year}-09-28`]: '教師節',
        [`${year}-10-10`]: '國慶日',
        [`${year}-12-25`]: '行憲紀念日'
      };

      if (fixedHolidays[dateKey]) return fixedHolidays[dateKey];

      // 2026年特殊公告假日與補假
      if (year === 2026) {
        const h2026 = {
          '2026-02-13': '春節前夕', '2026-02-16': '農曆初一', '2026-02-17': '農曆初二', 
          '2026-02-18': '農曆初三', '2026-02-19': '農曆初四', '2026-02-20': '農曆初五', '2026-02-23': '春節補假',
          '2026-04-03': '兒童節補假', '2026-04-06': '清明節補假',
          '2026-06-19': '端午節',
          '2026-09-25': '中秋節',
          '2026-10-09': '國慶日補假',
          '2026-10-25': '台灣光復節', '2026-10-26': '光復節補假'
        };
        if (h2026[dateKey]) return h2026[dateKey];
      }

      // 2027年春節連假 (2/4 ~ 2/10) 與重要假日
      if (year === 2027) {
        const h2027 = {
          '2027-02-04': '小年夜', '2027-02-05': '除夕', '2027-02-06': '農曆初一', 
          '2027-02-07': '農曆初二', '2027-02-08': '農曆初三', '2027-02-09': '春節補假', '2027-02-10': '春節補假',
          '2027-03-01': '和平紀念日補假',
          '2027-04-06': '兒童節清明節補假',
          '2027-06-08': '端午節',
          '2027-09-15': '中秋節',
          '2027-10-11': '國慶日補假'
        };
        if (h2027[dateKey]) return h2027[dateKey];
      }

      return null;
    }

    function getMonthDaysData(year, month) {
      const daysInMonth = new Date(year, month, 0).getDate();
      const firstDayOffset = new Date(year, month - 1, 1).getDay();
      const days = [];
      for (let i = 1; i <= daysInMonth; i++) {
        const dateObj = new Date(year, month - 1, i);
        const dayOfWeekIdx = dateObj.getDay();
        const weekDayStr = ['（日）', '（一）', '（二）', '（三）', '（四）', '（五）', '（六）'][dayOfWeekIdx];
        const isWeekend = dayOfWeekIdx === 0 || dayOfWeekIdx === 6;
        const holidayName = getNationalHolidayName(year, month, i);
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        days.push({ day: i, dateStr, weekDay: weekDayStr, isWeekend, holidayName, isHoliday: !!holidayName });
      }
      return { days, firstDayOffset, totalRedDays: days.filter(d => d.isWeekend || d.isHoliday).length };
    }

    function getStaffShiftOnDate(empName, dateStr) {
      const dObj = new Date(dateStr);
      const y = dObj.getFullYear();
      const m = dObj.getMonth() + 1;
      const key = `${y}-${m}-${empName}`;
      const userShifts = windowState.schedules[key];
      const isH = getNationalHolidayName(y, m, dObj.getDate()) || dObj.getDay() === 0 || dObj.getDay() === 6;
      if (userShifts) return userShifts[dObj.getDate() - 1] || (isH ? '休假' : '上班');
      return isH ? '休假' : '上班';
    }

    function calculateScheduleAndConflicts() {
      const { days, firstDayOffset, totalRedDays } = getMonthDaysData(windowState.scheduleYear, windowState.scheduleMonth);
      const activeEmps = windowState.employees.filter(e => e.status !== '離職');
      
      const fullSchedules = activeEmps.map(emp => {
        const key = `${windowState.scheduleYear}-${windowState.scheduleMonth}-${emp.name}`;
        const customShifts = windowState.schedules[key];
        const defaultShifts = days.map(m => (m.isWeekend || m.isHoliday ? '休假' : '上班'));
        const shifts = customShifts || defaultShifts;

        let scheduledOffCount = 0;
        shifts.forEach(s => {
          if (['休假', '事假', '病假', '陪產', '婚假', '喪假', '特一'].includes(s)) {
            scheduledOffCount += 1;
          } else if (s === '特半') {
            scheduledOffCount += 0.5;
          }
        });

        return {
          empName: emp.name,
          role: emp.role,
          healthCheckStatus: emp.healthCheckStatus,
          shifts,
          requiredOffDays: totalRedDays,
          scheduledOffCount,
          remainingUnscheduledOff: totalRedDays - scheduledOffCount
        };
      });

      const dailyWorkingCounts = {};
      days.forEach((m, dIdx) => {
        let count = 0;
        fullSchedules.forEach(empSched => {
          const s = empSched.shifts[dIdx] || '上班';
          if (s === '上班' || s === '特半' || s === '加班') count += 1;
        });
        dailyWorkingCounts[m.day] = count;
      });

      return { days, firstDayOffset, fullSchedules, dailyWorkingCounts, totalRedDays };
    }

    function renderEvaluations() {
      const uniqueRecords = getUniqueClockRecords();
      const evList = windowState.employees.map(emp => {
        const empTasks = windowState.tasks.filter(t => t.assignees.includes(emp.name));
        const completedTaskCount = empTasks.filter(t => t.status === '已完成').length;
        const uncompletedTaskCount = empTasks.filter(t => t.status !== '已完成' && t.date <= todayStr).length;
        const empClocks = uniqueRecords.filter(c => c.name === emp.name);
        const lateCount = empClocks.filter(c => c.status.includes('遲到')).length;

        const customEval = windowState.evaluations[emp.name] || {
          efficiencyScore: 5, tripCoopScore: 5, sanitationScore: 5, knowledgeScore: 5,
          comment: '工作熱情，門市服務顧客滿意度高，維護優秀清潔與餐點品質。'
        };

        const baseScore = 70;
        const eff = customEval.efficiencyScore || 5;
        const trip = customEval.tripCoopScore || 5;
        const san = customEval.sanitationScore || 5;
        const knw = customEval.knowledgeScore || 5;

        const calculatedScore = Math.min(100, Math.max(0,
          baseScore + (eff * 2) + (trip * 2) + (san * 2) + (knw * 2) + (completedTaskCount * 2) - (lateCount * 5) - (uncompletedTaskCount * 3)
        ));

        return {
          id: emp.id, name: emp.name, role: emp.role,
          efficiencyScore: eff, tripCoopScore: trip, sanitationScore: san, knowledgeScore: knw,
          completedTaskCount, uncompletedTaskCount, lateCount, totalScore: calculatedScore,
          comment: customEval.comment
        };
      });

      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-xs">
            <div>
              <h2 class="font-extrabold text-slate-900 text-base">🏅 門市員工績效考核表</h2>

            ${evList.map(ev => `

                  </div>
                  <div class="text-right">
                    <div class="flex space-x-1 justify-end mb-1">
                      <button onclick="printSingleEmployeeEval('${ev.name}')" class="bg-indigo-600 text-white font-bold px-2 py-0.5 rounded text-[10px] cursor-pointer">🖨️ 單獨列印</button>
                      ${windowState.isAdmin ? `<button onclick="openEditEvalModal('${ev.name}')" class="bg-amber-400 text-slate-950 font-bold px-2 py-0.5 rounded text-[10px] cursor-pointer">✏️ 編輯評分</button>` : ''}
                    </div>
                    <div class="text-2xl font-black text-indigo-600 font-mono">${ev.totalScore} 分</div>
                  </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl text-xs space-y-2 text-slate-700">
                  <div class="grid grid-cols-2 gap-2 bg-white p-2.5 rounded-xl border font-bold text-[11px]">
                    <div>⚡ 做事效率：${'⭐'.repeat(ev.efficiencyScore)}</div>
                    <div>🚗 出差配合：${'⭐'.repeat(ev.tripCoopScore)}</div>
                    <div class="text-emerald-800">🧹 衛生環境：${'⭐'.repeat(ev.sanitationScore)}</div>
                    <div class="text-indigo-800">📚 專業知識：${'⭐'.repeat(ev.knowledgeScore)}</div>
                  </div>

                  <p class="text-emerald-700 font-bold">✓ 任務完成：已完成 <strong>${ev.completedTaskCount}</strong> 項 (+${ev.completedTaskCount * 2}分)</p>
                  <p class="text-rose-700 font-bold">⚠️ 當日/逾期未完成任務：<strong>${ev.uncompletedTaskCount}</strong> 項 (-${ev.uncompletedTaskCount * 3}分)</p>
                  <p class="text-rose-600 font-bold">⚠️ 考勤遲到：遲到 <strong>${ev.lateCount}</strong> 次 (-${ev.lateCount * 5}分)</p>
                  <p class="italic text-indigo-900 bg-white p-2 rounded-lg border mt-1">📝 主管評語：${ev.comment}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderModals() {
      if (!windowState.activeModal) return '';

      if (windowState.activeModal === 'admin') {
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleAdminLoginSubmit(event)" class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-3">
              <h3 class="font-bold text-slate-900 text-base">🔑 解鎖管理員權限</h3>
              <input type="password" maxlength="4" id="admin-pin-input" required class="w-full p-2.5 border rounded-xl text-center font-mono text-lg" />
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-600 cursor-pointer">取消</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold cursor-pointer">解鎖</button>
              </div>
            </form>
          </div>
        `;
      }

      if (windowState.activeModal === 'taskModal') {
        const m = windowState.modalData;
        const taskCategories = ['調理包製作', '代工產品製作', '台北活動行程', '桃園活動行程', '台中活動行程', '台南活動行程', '高雄活動行程', '文書報價單作業', '私人行程'];
        const repeatOptions = ['單次', '每日', '每週', '每月', '每兩個月', '每三個月', '每半年', '每年'];
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleSaveTaskSubmit(event)" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3 overflow-y-auto max-h-[90vh]">
              <h3 class="font-bold text-base text-slate-900">${m.id ? '✏️ 編輯工作行程' : '📅 新增工作行程'}</h3>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">任務主題</label>
                <input type="text" id="task-title" required value="${m.title || ''}" placeholder="請輸入任務主題" class="w-full p-2.5 border rounded-xl text-xs" />
              </div>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">工作分類</label>
                  <select id="task-category" class="w-full p-2 border rounded-xl font-bold">
                    ${taskCategories.map(c => `<option value="${c}" ${m.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-purple-900 font-bold mb-1">🔁 循環重複選項</label>
                  <select id="task-repeat" class="w-full p-2 border border-purple-300 bg-purple-50 rounded-xl font-bold">
                    ${repeatOptions.map(r => `<option value="${r}" ${m.repeat === r ? 'selected' : ''}>${r}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">預定日期</label>
                  <input type="date" id="task-date" value="${m.date}" class="w-full p-2 border rounded-xl font-mono" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">開始時間</label>
                  <input type="time" id="task-start" value="${m.startTime || '09:00'}" class="w-full p-2 border rounded-xl font-mono" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">結束時間</label>
                  <input type="time" id="task-end" value="${m.endTime || '12:00'}" class="w-full p-2 border rounded-xl font-mono" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">地點</label>
                  <input type="text" id="task-location" value="${m.location || '台北總店'}" class="w-full p-2 border rounded-xl" />
                </div>
              </div>

              <div class="bg-amber-50/70 p-3 rounded-2xl border border-amber-200 space-y-2">
                <label class="block text-xs font-extrabold text-amber-950">📦 自訂備料/出勤工具檢查清單</label>
                <div class="flex gap-1.5">
                  <input type="text" id="new-chk-item-input" placeholder="輸入自訂檢查項目 (例: 高溫滅菌袋)" class="flex-1 p-2 border rounded-xl text-xs bg-white" />
                  <button type="button" onclick="addModalChecklistItem()" class="bg-amber-400 text-slate-950 px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer">+ 新增</button>
                </div>
                <div class="space-y-1 max-h-32 overflow-y-auto">
                  ${(m.checklist || []).map((chk, idx) => `
                    <div class="flex justify-between items-center bg-white px-2.5 py-1.5 rounded-xl border text-xs font-bold text-slate-700">
                      <span>• ${chk.item}</span>
                      <button type="button" onclick="removeModalChecklistItem(${idx})" class="text-rose-600 font-bold hover:text-rose-800 text-xs cursor-pointer">✕ 刪除</button>
                    </div>
                  `).join('')}
                  ${(!m.checklist || m.checklist.length === 0) ? `<p class="text-[10px] text-slate-400 italic">尚無自訂檢查項目</p>` : ''}
                </div>
              </div>

              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">👥 指派同仁 (點擊勾選，自動比對【${m.date}】排休防呆)</label>
                <div class="flex flex-wrap gap-1.5 p-2 bg-slate-50 border rounded-xl">
                  ${windowState.employees.map(emp => {
                    const isSel = (m.assignees || []).includes(emp.name);
                    const shiftToday = getStaffShiftOnDate(emp.name, m.date);
                    const isOff = ['休假', '事假', '病假', '陪產', '婚假', '喪假', '特一'].includes(shiftToday);
                    return `
                      <button
                        type="button"
                        onclick="toggleAssigneeInModal('${emp.name}')"
                        class="px-2.5 py-1 rounded-lg text-xs font-bold border ${isSel ? (isOff ? 'bg-rose-600 text-white' : 'bg-indigo-600 text-white') : (isOff ? 'bg-rose-50 text-rose-700' : 'bg-white text-slate-600')}"
                      >
                        ${isSel ? '✓ ' : '+ '}${emp.name} (${isOff ? `⚠️${shiftToday}` : '☀️上班'})
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1">詳細說明</label>
                <textarea id="task-content" rows="2" placeholder="工作詳細說明與交辦事項" class="w-full p-2.5 border rounded-xl text-xs">${m.content || ''}</textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-600 cursor-pointer">取消</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold cursor-pointer">儲存存檔</button>
              </div>
            </form>
          </div>
        `;
      }

      if (windowState.activeModal === 'empModal') {
        const emp = windowState.modalData;
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleSaveEmpSubmit(event)" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3 overflow-y-auto max-h-[90vh]">
              <h3 class="font-bold text-base text-slate-900">${emp.name ? `✏️ 編輯【${emp.name}】` : '➕ 新增門市同仁'}</h3>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div>
                  <label class="block text-slate-600 mb-1">工號</label>
                  <input type="text" id="emp-id" required value="${emp.id || ''}" class="w-full p-2 border rounded-xl font-mono font-bold" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">姓名</label>
                  <input type="text" id="emp-name" required value="${emp.name || ''}" class="w-full p-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">在職狀態</label>
                  <select id="emp-status" class="w-full p-2 border rounded-xl font-bold text-indigo-900">
                    <option value="在職" ${emp.status !== '離職' ? 'selected' : ''}>🟢 在職</option>
                    <option value="離職" ${emp.status === '離職' ? 'selected' : ''}>🔴 離職 (從名冊隱藏保留資料)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">體檢狀態</label>
                  <select id="emp-health-status" class="w-full p-2 border rounded-xl font-bold">
                    <option value="🟢 合格" ${emp.healthCheckStatus !== '🔴 體檢已過期' ? 'selected' : ''}>🟢 合格</option>
                    <option value="🔴 體檢已過期" ${emp.healthCheckStatus === '🔴 體檢已過期' ? 'selected' : ''}>🔴 體檢已過期 (自動鎖定排班)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">職稱崗位</label>
                  <input type="text" id="emp-role" required value="${emp.role || '門市服務員'}" class="w-full p-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">僱用類別</label>
                  <select id="emp-type" class="w-full p-2 border rounded-xl">
                    <option value="正職員工" ${emp.type === '正職員工' ? 'selected' : ''}>正職員工</option>
                    <option value="兼職 (PT)" ${emp.type === '兼職 (PT)' ? 'selected' : ''}>兼職 (PT)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">🏖️ 特休總天數</label>
                  <input type="number" step="0.5" id="emp-leave-entitled" value="${emp.leaveEntitled || 7}" class="w-full p-2 border rounded-xl font-bold text-indigo-900" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">🏖️ 已休天數</label>
                  <input type="number" step="0.5" id="emp-leave-used" value="${emp.leaveUsed || 0}" class="w-full p-2 border rounded-xl font-bold text-slate-700" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">🎂 生日</label>
                  <input type="date" id="emp-birthday" value="${emp.birthday || '1998-07-30'}" class="w-full p-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">📅 到職日</label>
                  <input type="date" id="emp-joindate" value="${emp.joinDate || todayStr}" class="w-full p-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">電話</label>
                  <input type="text" id="emp-phone" value="${emp.phone || ''}" class="w-full p-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">PIN 密碼</label>
                  <input type="text" maxlength="4" id="emp-pin" required value="${emp.pin || '8888'}" class="w-full p-2 border rounded-xl font-mono" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">緊急聯絡人</label>
                  <input type="text" id="emp-emg" value="${emp.emergencyContact || ''}" class="w-full p-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">緊急電話</label>
                  <input type="text" id="emp-emgphone" value="${emp.emergencyPhone || ''}" class="w-full p-2 border rounded-xl" />
                </div>
                <div class="col-span-2">
                  <label class="block text-slate-600 mb-1 font-bold">🏠 居住地址</label>
                  <input type="text" id="emp-address" value="${emp.address || ''}" class="w-full p-2 border rounded-xl" />
                </div>
                <div class="col-span-2">
                  <label class="block text-slate-600 mb-1 font-bold">📝 個人備註說明</label>
                  <textarea id="emp-note" rows="2" class="w-full p-2 border rounded-xl text-xs">${emp.note || ''}</textarea>
                </div>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-600 cursor-pointer">取消</button>
                <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">儲存存檔</button>
              </div>
            </form>
          </div>
        `;
      }

      if (windowState.activeModal === 'evalModal') {
        const ev = windowState.modalData;
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleSaveEvalSubmit(event)" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
              <h3 class="font-bold text-base text-slate-900">✏️ 修改【${ev.name}】績效考核評分與評語</h3>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">⚡ 做事效率 (1-5星)</label>
                  <select id="eval-eff" class="w-full p-2 border rounded-xl">
                    ${[5,4,3,2,1].map(n => `<option value="${n}" ${ev.efficiencyScore == n ? 'selected' : ''}>${n} 星</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">🚗 出差配合 (1-5星)</label>
                  <select id="eval-trip" class="w-full p-2 border rounded-xl">
                    ${[5,4,3,2,1].map(n => `<option value="${n}" ${ev.tripCoopScore == n ? 'selected' : ''}>${n} 星</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">🧹 衛生環境 (1-5星)</label>
                  <select id="eval-san" class="w-full p-2 border rounded-xl">
                    ${[5,4,3,2,1].map(n => `<option value="${n}" ${ev.sanitationScore == n ? 'selected' : ''}>${n} 星</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-slate-600 mb-1 font-bold">📚 專業知識 (1-5星)</label>
                  <select id="eval-knw" class="w-full p-2 border rounded-xl">
                    ${[5,4,3,2,1].map(n => `<option value="${n}" ${ev.knowledgeScore == n ? 'selected' : ''}>${n} 星</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">主管綜合評語</label>
                <textarea id="eval-comment" rows="3" required placeholder="請輸入主管評語" class="w-full p-2.5 border rounded-xl text-xs font-bold text-indigo-950">${ev.comment || ''}</textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-600 cursor-pointer">取消</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold cursor-pointer">儲存評語與星級</button>
              </div>
            </form>
          </div>
        `;
      }

      if (windowState.activeModal === 'annModal') {
        return `
          <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
            <form onsubmit="handleSaveAnnSubmit(event)" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
              <h3 class="font-bold text-base text-slate-900">📢 發布總部公告</h3>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">發布單位</label>
                <input type="text" id="ann-author-input" value="總部總經理室" class="w-full p-2.5 border rounded-xl text-xs font-bold" />
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1">公告等級</label>
                <select id="ann-level-sel" class="w-full p-2 border rounded-xl text-xs font-bold">
                  <option value="🔴 特急">🔴 特急/緊急</option>
                  <option value="🟠 重要">🟠 重要通知</option>
                  <option value="🔵 常規">🔵 一般常規</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">公告標題</label>
                <input type="text" id="ann-title-input" required placeholder="請輸入標題" class="w-full p-2.5 border rounded-xl text-xs" />
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">📷 上傳圖片/海報圖檔</label>
                <input type="file" accept="image/*" onchange="handleAnnImageUploadInModal(event)" class="w-full p-1 border rounded-xl text-xs" />
              </div>
              <div>
                <label class="block text-xs text-slate-600 mb-1 font-bold">公告詳細內容</label>
                <textarea id="ann-content-input" rows="3" required placeholder="請輸入詳細內容" class="w-full p-2.5 border rounded-xl text-xs"></textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-slate-600 cursor-pointer">取消</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold cursor-pointer">發布公告</button>
              </div>
            </form>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!windowState.currentUser) {
        app.innerHTML = renderLoginView();
        return;
      }

      let moduleHTML = '';
      switch (windowState.activeModule) {
        case 'announcements': moduleHTML = renderAnnouncements(); break;
        case 'tasks': moduleHTML = renderTasks(); break;
        case 'schedule': moduleHTML = renderSchedule(); break;
        case 'attendance': moduleHTML = renderAttendance(); break;
        case 'lateReport': moduleHTML = renderLateReport(); break;
        case 'hrRoster': moduleHTML = renderHrRoster(); break;
        case 'evaluation': moduleHTML = renderEvaluations(); break;
        default: moduleHTML = renderAnnouncements();
      }

      app.innerHTML = `
        <div class="min-h-screen bg-slate-100 flex justify-center py-0 sm:py-6 font-sans">
          <div class="w-full max-w-5xl bg-white min-h-screen sm:min-h-[900px] sm:rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col">
            ${renderHeader()}
            <main class="flex-1 p-4 sm:p-5 space-y-5 bg-slate-50/70 overflow-y-auto">
              ${moduleHTML}
            </main>
          </div>
        </div>
        ${renderModals()}
      `;
    }

    setInterval(() => {
      const clockEl = document.getElementById('live-clock-display');
      if (clockEl) clockEl.textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    }, 1000);

    // 🚀 安全啟動渲染與同步
    try {
      render();
      initFirebaseSync();
    } catch (e) {
      console.error("Boot Error:", e);
    }
  </script>
</body>
</html>
